<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jeu du dieu</title>
<style>
:root{--bg:#0f1014;--card:#1b1d24;--line:#2d313c;--ink:#ecebe4;--quiet:#9a9c9a;--gold:#e0b45c;--rose:#e0197d;--good:#6fbf73;--bad:#d96b5c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
header .nom{font-weight:600;font-size:16px}
header .nom small{display:block;font-weight:400;font-size:11px;color:var(--quiet)}
.compteurs{display:flex;gap:14px}
.cpt{text-align:center;min-width:64px}
.cpt b{display:block;font-size:22px;line-height:1;transition:transform .25s}
.cpt.gold b{color:var(--gold)}
.cpt.rose b{color:#ff6fb5}
.cpt small{font-size:11px;color:var(--quiet)}
.cpt.bump b{transform:scale(1.35)}
.delta{position:absolute;font-size:14px;font-weight:600;animation:monte 1.2s forwards;pointer-events:none}
@keyframes monte{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.scene{flex:1;display:flex;flex-direction:column;min-height:0}
.portrait{flex:0 0 auto;height:34vh;max-height:300px;background:radial-gradient(ellipse at 50% 90%,#2a1a2a 0%,var(--bg) 70%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.portrait img{height:100%;object-fit:contain;filter:drop-shadow(0 0 24px rgba(224,25,125,.25))}
.portrait .vide{color:var(--quiet);font-size:13px;padding-bottom:20px}
.portrait .etat{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--quiet);background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px}
.dialogue{flex:1;overflow:auto;padding:14px 16px 20px}
.qui{font-size:12px;color:var(--rose);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.qui.monde{color:var(--quiet)}
.texte{font-size:17px;line-height:1.5;min-height:60px;animation:fade .3s}
.texte p{margin:0 0 10px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.choix{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.choix button{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);color:var(--ink);border-radius:10px;padding:11px 14px;font-size:15px;text-align:left;line-height:1.35}
.choix button small{display:block;color:var(--quiet);font-size:12px;margin-top:2px}
.choix button:active{background:#262a34}
.choix button.suite{border-left-color:var(--line);color:var(--quiet);text-align:center}
.choix button:disabled{opacity:.4}
.setup{padding:24px 18px;max-width:480px;margin:auto}
.setup h1{margin:0 0 6px;font-size:24px}
.setup p{color:var(--quiet);font-size:14px}
.setup label{display:block;margin:16px 0 6px;color:var(--quiet);font-size:13px}
.setup input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px}
.setup .go{margin-top:24px;width:100%;padding:14px;background:var(--gold);border:0;border-radius:10px;font-size:17px;font-weight:600}
.setup .cont{background:none;border:1px solid var(--line);color:var(--quiet);width:100%;padding:12px;border-radius:10px;margin-top:10px}
.fin{padding:24px 18px;text-align:center}
.fin h1{font-size:22px;color:var(--gold)}
.fin p{color:var(--ink);font-size:16px;text-align:left}
.fin button{margin-top:20px;padding:12px 20px;background:var(--gold);border:0;border-radius:10px;font-size:16px;font-weight:600}
.menu{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--quiet);background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px;border:0}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<script>
/* ============================================================
   LE JEU DU DIEU — v5, jeu narratif
   Un écran : le prophète, sa réplique, tes choix.
   Deux compteurs : ferveur, croyants.
   ============================================================ */
const VERSION = 5;
const SAVE_KEY = 'jeu-du-dieu-v5';

/* ---------- état ---------- */
let S = null;
const def = () => ({version:VERSION, nom:'', ferveur:0, croyants:1, foi:40, noeud:'j1_intro', jour:1, flags:{}, mort:[], ombre:0, histo:[]});
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
function flag(k){ return !!S.flags[k]; }
function set(k,v=true){ S.flags[k]=v; }

/* ---------- le prophète ---------- */
const P = {nom:'Aurèle Vauclair', metier:'médecin'};
// Les textes utilisent {dieu} pour ton nom.
const T = s => s.replace(/\{dieu\}/g, S.nom);

/* ============================================================
   LE RÉCIT
   Chaque nœud : {qui:'p'|'monde', t:[paragraphes], c:[{l, s, fx:{ferveur,croyants,foi,ombre,flag,mort}, go}]}
   fx est appliqué au clic, affiché sur les compteurs.
   Un nœud peut être une fonction (noeud dynamique selon les flags).
   ============================================================ */
const N = {

/* ---------------- JOUR 1 — la naissance ---------------- */
j1_intro: {qui:'monde', t:[
  'Une ville de deux mille âmes, serrée entre la rivière et la colline. Deux dieux y règnent depuis toujours : Ormund, le Vieux Dieu des Moissons, dont le temple domine la place, et Sélune, la Dame des Eaux, qu\'on prie au port.',
  'Toi, tu n\'as pas de temple. Tu n\'as pas de nom que quelqu\'un connaisse. Tu viens d\'ouvrir les yeux, et la première chose que tu vois, c\'est un homme assis sur un banc de pierre, derrière l\'hôpital des pauvres, à trois heures du matin.',
  'Il a les cheveux blancs et roses, un stéthoscope autour du cou, une croix au bout d\'une chaîne. Il vient de perdre un patient. Il parle à voix basse, et il ne parle à personne. Il parle à toi.'
], c:[{l:'Écouter.', go:'j1_aurele'}]},

j1_aurele: {qui:'p', t:[
  'Tu sais quoi, Ormund ? Va te faire voir. Quarante ans que je te prie et quarante ans que tu laisses crever mes malades. Ce soir c\'était une gamine de six ans. Six ans. Elle m\'a demandé si tu allais venir. J\'ai dit oui.',
  'J\'ai menti à une gamine de six ans.',
  'Alors voilà. S\'il y a autre chose là-haut. N\'importe quoi. Un dieu de rechange, un dieu d\'occasion, je m\'en fous. Fais un signe. Un seul. Et je suis à toi.'
], c:[
  {l:'Faire tomber la croix de sa chaîne, sans bruit, dans sa main ouverte.', s:'un signe discret', fx:{foi:+15, ferveur:+1}, go:'j1_signe_doux'},
  {l:'Faire s\'allumer d\'un coup toutes les lampes de l\'hôpital derrière lui.', s:'un signe que tout le monde verra', fx:{foi:+10, ferveur:+2, flag:'lampes'}, go:'j1_signe_fort'},
  {l:'Ne rien faire. Attendre qu\'il parle encore.', s:'un dieu ne répond pas au premier venu', fx:{foi:-5}, go:'j1_silence'}
]},

j1_signe_doux: {qui:'p', t:[
  'Il a regardé la croix dans sa paume pendant une bonne minute. La chaîne n\'était pas cassée. Elle était juste… ouverte.',
  '« D\'accord. D\'accord. Je sais pas qui tu es. Mais t\'as entendu, et lui il a jamais entendu. Ça me suffit. »',
  'Il a remis la croix autour de son cou. Il s\'est levé. « Il te faut un nom. Je vais pas prier "machin". »'
], c:[{l:'Lui souffler ton nom.', go:'j1_nom'}]},

j1_signe_fort: {qui:'p', t:[
  'Les trente fenêtres de l\'hôpital se sont allumées en même temps. Deux infirmières ont crié. Un vieux a hurlé au feu.',
  'Lui, il n\'a pas bougé. Il a juste souri, un sourire qui n\'était pas très gentil. « Ah ouais. T\'es pas du genre discret, toi. Ça me va. Moi non plus. »',
  '« Les gens vont dire que c\'est la foudre. Laisse-les. Moi je sais. Il te faut un nom. »'
], c:[{l:'Lui souffler ton nom.', go:'j1_nom'}]},

j1_silence: {qui:'p', t:[
  'Rien. Le vent. Une porte qui bat quelque part.',
  'Il a ri, un rire fatigué. « Évidemment. Personne. » Il s\'est levé, il a fait trois pas vers la porte.',
  'Et il s\'est arrêté. Parce qu\'il avait senti, dans son dos, quelque chose qui le regardait. Pas Ormund. Pas Sélune. Autre chose. « …T\'es là, hein. T\'es là et tu dis rien. Bon. Ça aussi ça me va. Mais il te faut un nom. »'
], c:[{l:'Lui souffler ton nom.', go:'j1_nom'}]},

j1_nom: {qui:'p', t:[
  '« {dieu}. » Il l\'a dit deux fois, pour voir comment ça sonnait. « {dieu}. Bon. C\'est pas pire qu\'Ormund. »',
  '« Je m\'appelle Aurèle Vauclair. Je suis médecin. Enfin, médecin des pauvres, ceux que les autres veulent pas. Je bois trop, je dors pas, et à partir de ce soir, je suis ton prophète. Premier et dernier croyant de {dieu}. »',
  '« Demain je retourne à l\'hôpital. Et là-bas, il y a des gens qui meurent. Alors dis-moi, {dieu} : qu\'est-ce que tu sais faire ? »'
], c:[
  {l:'« Je peux guérir. Mais pas gratuitement. »', s:'la voie du médecin', fx:{flag:'voie_soin'}, go:'j1_fin'},
  {l:'« Je peux leur faire peur. La peur fait prier. »', s:'la voie de l\'ombre', fx:{ombre:+1, flag:'voie_peur'}, go:'j1_fin'},
  {l:'« Je ne sais pas encore. Montre-moi la ville. »', s:'la voie du regard', fx:{foi:+3}, go:'j1_fin'}
]},

j1_fin: {qui:'monde', t:[
  'Il est rentré chez lui à l\'aube. Avant de s\'endormir, il a fait une chose qu\'il n\'avait pas faite depuis vingt ans : il a prié. Pas Ormund. Toi.',
  'Et pour la première fois, tu as senti quelque chose te traverser. Un point de ferveur. Un seul. C\'est le poids d\'un homme qui croit.'
], c:[{l:'Jour 2', go:'j2_hopital', fx:{ferveur:+1, jour:2}}]},

/* ---------------- JOUR 2 — l'hôpital ---------------- */
j2_hopital: {qui:'p', t:[
  'Salle commune de l\'hôpital des pauvres. Vingt lits, trente malades. Ça sent la fièvre et le chou bouilli.',
  '« Bon. Au fond à gauche, Marthe Lenoir, la boulangère du port, une pneumonie, elle en a pour trois jours si personne fait rien. À droite, le petit Colin Moreau, douze ans, une jambe cassée qui s\'infecte, on va la couper demain. Et au milieu, la mère Garnier, qui n\'a rien du tout mais qui vient ici parce qu\'elle a personne. »',
  '« J\'ai deux mains et une nuit. Toi t\'as quoi ? »'
], c:[
  {l:'« Guéris Marthe. Discrètement. Et dis-lui qui l\'a sauvée. »', s:'2 ferveur · une boulangère parle à tout le port', fx:{ferveur:-2, flag:'marthe'}, go:'j2_marthe'},
  {l:'« Sauve la jambe du gamin. Devant tout le monde. »', s:'2 ferveur · trente témoins', fx:{ferveur:-2, flag:'colin'}, go:'j2_colin'},
  {l:'« Assieds-toi avec la mère Garnier. Ça ne coûte rien. »', s:'gratuit', fx:{foi:+5, flag:'garnier'}, go:'j2_garnier'},
  {l:'« Ne fais rien. Laisse Ormund échouer. On ramassera les déçus. »', s:'la voie de l\'ombre', fx:{ombre:+1, foi:-8}, go:'j2_rien'}
]},

j2_marthe: {qui:'p', t:[
  'Je lui ai posé la main sur le front et j\'ai dit ton nom tout bas. Elle a toussé une dernière fois et elle s\'est endormie comme un bébé. Ce matin elle voulait rentrer faire son pain.',
  'Je lui ai dit : « C\'est pas moi. C\'est {dieu}. » Elle a demandé qui c\'était. J\'ai dit : « Celui qui t\'a entendue quand les autres dormaient. »',
  'Elle est repartie au port. Et une boulangère, ça parle à cinquante personnes par jour.'
], c:[{l:'Continuer.', fx:{croyants:+1}, go:'j2_fin'}]},

j2_colin: {qui:'p', t:[
  'J\'ai enlevé le pansement. La jambe était noire jusqu\'au genou. J\'ai dit ton nom à voix haute, trente personnes ont tourné la tête, et j\'ai posé la main dessus.',
  'Elle est redevenue rose. Comme ça. Le gamin a hurlé, pas de douleur, de peur. Sa mère s\'est mise à genoux. Deux vieux ont fait le signe d\'Ormund, par réflexe, puis ils se sont regardés : ce n\'était pas Ormund.',
  'La moitié de la salle a demandé ton nom avant midi. L\'autre moitié a demandé à changer d\'hôpital.'
], c:[{l:'Continuer.', fx:{croyants:+3, flag:'remarque'}, go:'j2_fin'}]},

j2_garnier: {qui:'p', t:[
  'Je me suis assis sur son lit. Elle m\'a raconté son mari, mort il y a onze ans, et ses deux fils partis à la ville d\'en bas. Elle m\'a tenu la main une heure.',
  'À la fin elle a dit : « Vous êtes un brave homme, docteur. » J\'ai dit : « Non. Mais je connais quelqu\'un qui écoute. » Elle a souri. Elle n\'a rien promis.',
  'Marthe Lenoir est morte dans la nuit. Et demain on coupe la jambe du gamin. Tu as choisi la vieille. Je ne dis pas que c\'était mal.'
], c:[{l:'Continuer.', fx:{mort:'Marthe Lenoir'}, go:'j2_fin'}]},

j2_rien: {qui:'p', t:[
  'Alors j\'ai rien fait. J\'ai regardé. Le prêtre d\'Ormund est passé à midi, il a béni les lits, il a pris la pièce, il est reparti. Marthe est morte le soir. Le gamin a perdu sa jambe.',
  'Sa mère a craché sur la statue d\'Ormund en sortant. Elle ne sait pas encore à qui prier à la place. Mais elle cherche.',
  'Tu avais raison : les déçus sont là. J\'ai juste du mal à te regarder en face ce soir.'
], c:[{l:'Continuer.', fx:{mort:'Marthe Lenoir', flag:'moreau_decus'}, go:'j2_fin'}]},

j2_fin: {qui:'monde', t:[
  'Le soir, Aurèle a prié. Et quelqu\'un d\'autre, quelque part dans la ville, a prononcé ton nom sans trop savoir pourquoi.',
  'La ferveur monte avec ceux qui croient. Chaque croyant t\'en rapporte un peu chaque jour. Mais un croyant qui n\'obtient jamais rien finit par partir.'
], c:[{l:'Jour 3', go:'j3_pretre', fx:{jour:3}}]},

/* ---------------- JOUR 3 — le prêtre d'Ormund ---------------- */
j3_pretre: {qui:'p', t:[
  'Visite ce matin. Le père Anselme, grand prêtre d\'Ormund, en personne, avec deux moines derrière lui. Il n\'avait jamais mis les pieds à l\'hôpital des pauvres.',
  '« Docteur Vauclair. On me dit que vous invoquez un nom nouveau. On me dit que des malades guérissent sans qu\'Ormund soit prié. Vous comprenez que ça pose un problème. »',
  'Il m\'a proposé un marché : je reviens dans le giron d\'Ormund, je dis que les guérisons étaient les siennes, et le temple finance l\'hôpital. Cent lits. Des médicaments. Du vrai.'
], c:[
  {l:'« Refuse. Dis-lui que {dieu} ne se vend pas. »', s:'il perd le temple pour toujours', fx:{foi:+10, ferveur:+2, flag:'pretre_ennemi'}, go:'j3_refus'},
  {l:'« Accepte. Prends l\'argent. On verra après. »', s:'la ruse', fx:{foi:-10, flag:'pretre_marche'}, go:'j3_marche'},
  {l:'« Dis-lui de venir voir de ses yeux. Et guéris quelqu\'un devant lui. »', s:'3 ferveur · un coup de poker', fx:{ferveur:-3}, go:'j3_poker'}
]},

j3_refus: {qui:'p', t:[
  'Je lui ai dit que {dieu} n\'avait pas besoin de ses lits, et que s\'il voulait voir un miracle il n\'avait qu\'à arrêter de prendre la pièce aux mourants.',
  'Il est devenu tout blanc. Il a dit : « Vous venez de vous faire un ennemi, docteur. » J\'ai dit que j\'en avais déjà un, et qu\'il s\'appelait Ormund.',
  'Les deux moines ont ri. Un seul. L\'autre m\'a regardé bizarrement en partant. Je crois qu\'il a retenu ton nom.'
], c:[{l:'Continuer.', fx:{croyants:+1}, go:'j3_fin'}]},

j3_marche: {qui:'p', t:[
  'J\'ai dit oui. J\'ai signé. J\'ai dit que les guérisons étaient à Ormund. Et j\'ai eu envie de vomir.',
  'L\'argent arrive la semaine prochaine. Cent lits. Je sais que c\'est pour les malades. Je sais que tu me l\'as demandé.',
  'Mais Marthe Lenoir va dire partout qu\'Ormund l\'a sauvée. Et moi je vais devoir hocher la tête.'
], c:[{l:'Continuer.', fx:{croyants:-1}, go:'j3_fin'}]},

j3_poker: {qui:'p', t:[
  'Je l\'ai emmené au fond de la salle. Un ouvrier du port, Firmin Roussel, le dos cassé par une poutre, qui ne bougeait plus les jambes depuis un mois. Le père Anselme l\'avait béni deux fois.',
  'J\'ai dit ton nom. J\'ai posé la main. Firmin s\'est levé.',
  'Le prêtre n\'a rien dit. Il est sorti. Mais un des deux moines est resté. Il s\'appelle Barnabé. Il a demandé s\'il pouvait revenir demain. Et Firmin, lui, il te suit déjà : il a vu.'
], c:[{l:'Continuer.', fx:{croyants:+2, flag:'barnabe', flag2:'firmin'}, go:'j3_fin'}]},

j3_fin: {qui:'monde', t:[
  'Ce soir-là, au temple d\'Ormund, le père Anselme a fait sonner les cloches une heure de plus que d\'habitude. Pour rappeler à la ville qui était le dieu ici.',
  'Personne n\'a trouvé ça rassurant.'
], c:[{l:'Jour 4', go:'j4_sacrifice', fx:{jour:4}}]},

/* ---------------- JOUR 4 — le prix ---------------- */
j4_sacrifice: {qui:'p', t:[
  'Bon. Faut qu\'on parle. Je sens quand tu agis : ça vient de quelque part, et ce quelque part, c\'est moi. Chaque fois que tu guéris, je suis un peu plus vide. Je me trompe ?',
  '…Non. Je me trompe pas. Alors dis-moi ce que tu veux. Je sais ce qu\'Ormund demandait : des moutons. Des cierges. Des pièces. Toi, tu veux quoi ? Qu\'est-ce que je te donne ?'
], c:[
  {l:'« Ta nuit. Dors sur le parvis, dehors, pour qu\'on te voie prier. »', s:'il s\'humilie en public · +4 ferveur', fx:{ferveur:+4, foi:+5, flag:'sac_parvis'}, go:'j4_parvis'},
  {l:'« Ta bouteille. Arrête de boire. Pour moi. »', s:'un sacrifice qui dure · +3 ferveur, puis chaque jour', fx:{ferveur:+3, foi:+8, flag:'sobre'}, go:'j4_bouteille'},
  {l:'« Ton sang. Ouvre-toi la main sur l\'autel d\'Ormund, devant tout le monde. »', s:'brutal · +8 ferveur', fx:{ferveur:+8, foi:+3, ombre:+1, flag:'sac_sang'}, go:'j4_sang'},
  {l:'« Rien. Je ne demande rien. »', s:'il ne comprend pas', fx:{foi:-10}, go:'j4_rien'}
]},

j4_parvis: {qui:'p', t:[
  'Je l\'ai fait. Toute la nuit sur les marches du temple d\'Ormund, à genoux, à dire ton nom à voix basse. Il a plu à partir de deux heures.',
  'Des gens sont passés. Certains ont ri. Un gamin m\'a jeté un trognon. Et vers quatre heures, une femme s\'est agenouillée à côté de moi sans rien dire. Je ne la connais pas. Elle est repartie avant l\'aube.',
  'Je suis trempé, j\'ai mal partout, et je ne me suis jamais senti aussi sûr de toi.'
], c:[{l:'Continuer.', fx:{croyants:+1}, go:'j4_fin'}]},

j4_bouteille: {qui:'p', t:[
  'J\'ai vidé les trois bouteilles dans l\'évier. Ça m\'a pris un quart d\'heure parce que je m\'arrêtais à chaque fois.',
  'Tu sais ce que c\'est, trente ans ? C\'est la première nuit depuis trente ans où j\'ai dormi sans. J\'ai pas dormi, d\'ailleurs. J\'ai tremblé jusqu\'au matin.',
  'Mais je t\'ai eu dans la tête toute la nuit. Ça compte comme une prière, j\'imagine. Et demain ce sera pareil. Et après-demain.'
], c:[{l:'Continuer.', go:'j4_fin'}]},

j4_sang: {qui:'p', t:[
  'Midi, place du temple, jour de marché. J\'ai monté les marches, j\'ai sorti mon scalpel, et je me suis ouvert la paume sur l\'autel d\'Ormund en criant ton nom.',
  'Trois cents personnes. Un silence que je n\'oublierai pas. Puis les cris. Les moines ont voulu me faire descendre, deux ouvriers du port les en ont empêchés. Firmin Roussel était avec eux.',
  'Le sang a coulé sur la pierre d\'Ormund. Ça ne s\'efface pas. Ils ont essayé toute l\'après-midi. Toute la ville connaît ton nom ce soir. Et toute la ville a peur de toi.'
], c:[{l:'Continuer.', fx:{croyants:+3, flag:'remarque'}, go:'j4_fin'}]},

j4_rien: {qui:'p', t:[
  'Rien ? Un dieu qui ne demande rien ?',
  'Tu sais ce que ça fait, à un croyant ? Ça lui dit que ce qu\'il a ne vaut rien. Ormund demandait des moutons, c\'était con, mais au moins on savait qu\'on comptait.',
  'Je vais continuer à te prier. Mais je ne sais plus trop pourquoi.'
], c:[{l:'Continuer.', go:'j4_fin'}]},

j4_fin: {qui:'monde', t:[
  'La ferveur ne tombe pas du ciel. Elle vient de ce qu\'on te donne. Plus le don coûte, plus tu reçois.',
  'Et plus Aurèle donne, plus sa foi grandit. Un homme qui s\'est sacrifié pour un dieu ne peut plus se permettre de ne pas y croire.'
], c:[{l:'Jour 5', go:'j5_bete', fx:{jour:5}}]},

/* ---------------- JOUR 5 — la bête ---------------- */
j5_bete: {qui:'p', t:[
  'On a retrouvé le berger des Dufresne ce matin, dans le pré de la colline. Enfin, ce qu\'il en restait. Et huit moutons.',
  'Le père Anselme dit que c\'est un loup. Les gens de la colline disent que ce n\'est pas un loup, parce qu\'un loup ne laisse pas des traces comme ça. Grosses comme une assiette.',
  'La colline est le quartier d\'Ormund depuis toujours. Ils ont prié toute la journée. Ce soir, ils ont encore peur. Et moi, {dieu}, je suis médecin, pas chasseur.'
], c:[
  {l:'« Monte à la colline. Dis-leur que {dieu} les protège. Et protège-les vraiment. »', s:'6 ferveur · la bête ne les touchera pas', fx:{ferveur:-6, flag:'colline_protegee'}, go:'j5_protege'},
  {l:'« Va chasser la bête toi-même. Cette nuit. »', s:'il peut mourir', fx:{foi:+5}, go:'j5_chasse'},
  {l:'« Laisse-la faire. Quand Ormund aura échoué trois nuits, ils viendront à nous. »', s:'la voie de l\'ombre', fx:{ombre:+1}, go:'j5_laisse'},
  {l:'« Dis-leur que c\'est Ormund qui l\'a envoyée. »', s:'un mensonge qui marche', fx:{ombre:+1, ferveur:+2}, go:'j5_mensonge'}
], cond:()=>true},

j5_protege: {qui:'p', t:[
  'Je suis monté à la colline avec ma trousse et une lanterne. J\'ai fait le tour des fermes, j\'ai dit ton nom sur chaque porte, j\'ai tracé ta croix à la craie.',
  'La bête est venue. On l\'a entendue. Elle a tourné autour des fermes toute la nuit en grognant, et elle n\'a pas pu entrer. Au matin, les traces s\'arrêtaient toutes à un mètre des portes.',
  'La colline était à Ormund depuis mille ans. Ce matin, quatre familles ont décroché son signe. Elles n\'ont pas encore accroché le tien. Mais elles savent qui a tenu la porte.'
], c:[{l:'Continuer.', fx:{croyants:+5}, go:'j5_fin'}]},

j5_chasse: {qui:'p', t:[
  'Je suis parti avec le fusil du vieux Dufresne, qui n\'avait pas servi depuis la guerre. J\'ai attendu dans le pré. Il faisait un froid de chien.',
  'Elle est venue à trois heures. Je ne te dirai pas à quoi elle ressemblait, parce que je ne suis pas sûr. Grande. Trop de pattes. J\'ai tiré deux fois, je l\'ai touchée une fois, elle m\'a ouvert le bras de l\'épaule au coude.',
  'Elle est repartie en boitant. Moi aussi. Mais ce matin la colline entière sait que le médecin de {dieu} est monté seul là où les moines d\'Ormund n\'ont pas osé aller.'
], c:[{l:'Continuer.', fx:{croyants:+3, foi:+5, flag:'bras_blesse'}, go:'j5_fin'}]},

j5_laisse: {qui:'p', t:[
  'J\'ai rien fait. Trois nuits. La bête a pris deux autres bergers et la petite dernière des Dufresne, neuf ans, qui était sortie chercher le chien.',
  'Au quatrième matin, les Dufresne sont descendus à l\'hôpital. Le père tenait encore le manteau de la gamine. Il a dit : « Ormund n\'a rien fait. Est-ce que le vôtre fait quelque chose ? »',
  'J\'ai dit oui. Il m\'a cru. Ils te suivent tous, maintenant. Je n\'arrive pas à être content.'
], c:[{l:'Continuer.', fx:{croyants:+4, foi:-8, mort:'la petite Dufresne'}, go:'j5_fin'}]},

j5_mensonge: {qui:'p', t:[
  'Je l\'ai dit au marché. « La bête, c\'est Ormund qui l\'envoie, parce que la colline a laissé le médecin de {dieu} guérir ses malades. Il vous punit. »',
  'C\'est faux. Je le sais. Mais c\'est le genre de faux qui ressemble à du vrai. Le soir même, trois familles ont jeté le signe d\'Ormund dans la rivière.',
  'Et le père Anselme a fait prêcher sur la place que c\'était moi, le monstre. Il n\'a pas tout à fait tort.'
], c:[{l:'Continuer.', fx:{croyants:+3, flag:'pretre_ennemi'}, go:'j5_fin'}]},

j5_fin: {qui:'monde', t:[
  'La bête est toujours là, quelque part sur la colline. Elle reviendra.',
  'Mais pour la première fois, ce n\'est pas au temple d\'Ormund qu\'on a prié pour l\'éloigner.'
], c:[{l:'Jour 6', go:'j6_barnabe', fx:{jour:6}}]},

/* ---------------- JOUR 6 — le disciple ---------------- */
j6_barnabe: ()=>({qui:'p', t:[
  flag('barnabe') ? 'Barnabé est revenu. Le petit moine d\'Ormund, celui qui était resté quand le père Anselme est sorti. Il a enlevé sa robe. Il l\'a pliée, posée sur le lit de Firmin, et il a dit : « Je veux apprendre. »'
                  : 'Un gars est venu ce matin. Barnabé. Un moine d\'Ormund, enfin, un ancien. Il a jeté sa robe sur le lit et il a dit : « J\'ai entendu ce qui se passe ici. Je veux apprendre. »',
  'Il a vingt ans. Il sait lire, écrire, et il connaît tous les rites d\'Ormund par cœur. Il dit qu\'il n\'a jamais rien senti en les faisant. Il dit que la nuit où j\'ai prié sur le parvis, lui, il a senti quelque chose.',
  'Je peux en faire quelque chose. Mais ça dépend de toi : c\'est quoi, un disciple de {dieu} ?'
], c:[
  {l:'« Un médecin. Apprends-lui à soigner. »', s:'les disciples guérissent', fx:{flag:'disc_soin', foi:+3}, go:'j6_soin'},
  {l:'« Une voix. Apprends-lui à parler. Il ira dans les quartiers où tu ne vas pas. »', s:'les disciples prêchent', fx:{flag:'disc_voix'}, go:'j6_voix'},
  {l:'« Un espion. Qu\'il garde sa robe et retourne au temple. »', s:'la voie de l\'ombre', fx:{ombre:+1, flag:'disc_espion'}, go:'j6_espion'},
  {l:'« Je n\'ai pas besoin de disciple. J\'ai toi. »', s:'il reste seul', fx:{foi:+5}, go:'j6_seul'}
]}),

j6_soin: {qui:'p', t:[
  'Je lui ai appris à nettoyer une plaie, à reconnaître une fièvre qui tue d\'une fièvre qui passe, et à dire ton nom avant de poser les mains.',
  'Il n\'a pas mes mains. Mais il a quelque chose que je n\'ai pas : il y croit sans avoir eu besoin d\'un signe. Il a guéri une angine ce soir. Tout seul. Il a pleuré.',
  'Deux prophètes valent mieux qu\'un. Enfin, un prophète et demi.'
], c:[{l:'Continuer.', fx:{croyants:+1, ferveur:+1}, go:'j6_fin'}]},

j6_voix: {qui:'p', t:[
  'Je lui ai dit de descendre au port, là où les gens me connaissent de nom mais ne m\'ont jamais vu, et de raconter. Pas de prêcher : raconter. Marthe, Firmin, le gamin Moreau.',
  'Il est revenu le soir avec douze noms. Douze personnes qui veulent qu\'on vienne les voir. Il a une voix qui porte, ce petit. Mieux que la mienne, qui est rouillée par le tabac.',
  'Le port était à Sélune. Sélune n\'a pas de prêtre, elle a des vieilles qui jettent des fleurs dans l\'eau. Elle va être facile à remplacer. Trop facile, peut-être.'
], c:[{l:'Continuer.', fx:{croyants:+4}, go:'j6_fin'}]},

j6_espion: {qui:'p', t:[
  'Il a remis sa robe. Il est retourné au temple avec une tête de moine contrit, et le père Anselme l\'a repris, parce que le père Anselme ne sait pas refuser un repentant.',
  'Ce soir il m\'a glissé un papier sous la porte. Le temple prépare quelque chose. Une procession. Un grand miracle d\'Ormund, monté de toutes pièces, pour la fin du mois.',
  'On a un homme à l\'intérieur. Je ne suis pas fier. Mais je suis content.'
], c:[{l:'Continuer.', fx:{ferveur:+2}, go:'j6_fin'}]},

j6_seul: {qui:'p', t:[
  'Je lui ai dit non. Il n\'a pas compris. Il est resté une heure sur le banc dehors, puis il est parti vers le port.',
  'Je pense qu\'il va continuer à parler de toi quand même. Mais sans qu\'on le lui ait demandé, et sans savoir quoi dire. On verra ce que ça donne.',
  'Toi et moi, alors. Ça me va. Ça m\'a toujours été.'
], c:[{l:'Continuer.', go:'j6_fin'}]},

j6_fin: {qui:'monde', t:[
  'Au temple, le père Anselme a commencé à prononcer ton nom dans ses sermons. Pour le maudire. C\'est encore de la publicité.'
], c:[{l:'Jour 7', go:'j7_dogme', fx:{jour:7}}]},

/* ---------------- JOUR 7 — le premier dogme ---------------- */
j7_dogme: ()=>({qui:'p', t:[
  `On est ${S.croyants} à te suivre, maintenant. Ça commence à faire du monde. Et du monde, ça demande des règles. Ils me demandent : « Qu\'est-ce qu\'il faut faire ? Il faut prier quand ? Il faut donner quoi ? »`,
  'Ormund avait un livre. Sélune a des chansons. Toi, tu as moi, et je suis nul pour les règles.',
  'Alors dis-moi. Le premier commandement de {dieu}. Celui que tous tes croyants devront suivre.'
], c:[
  {l:'« Chaque jour, une prière. Rien de plus. »', s:'léger · +1 ferveur par croyant et par jour', fx:{flag:'dogme_priere'}, go:'j7_priere'},
  {l:'« Chaque semaine, un repas offert à qui a faim. »', s:'coûteux pour eux · +2 par croyant, et la ville t\'aime', fx:{flag:'dogme_repas'}, go:'j7_repas'},
  {l:'« Chaque mois, du sang sur l\'autel. »', s:'lourd · +4 par croyant, et la ville a peur', fx:{flag:'dogme_sang', ombre:+1}, go:'j7_sang'},
  {l:'« Aucune règle. Qu\'ils fassent ce qu\'ils veulent. »', s:'la liberté · 0 ferveur', fx:{flag:'dogme_libre'}, go:'j7_libre'}
]}),

j7_priere: {qui:'p', t:[
  'Une prière par jour. Je leur ai dit : le matin, en se levant, avant de parler à quelqu\'un. Dire ton nom et une chose vraie.',
  'C\'est simple. Tout le monde peut. Et chaque matin, maintenant, je te sens arriver par petites touches, une par maison. C\'est doux. C\'est pas beaucoup. Mais ça ne s\'arrête jamais.'
], c:[{l:'Continuer.', go:'j7_fin'}]},

j7_repas: {qui:'p', t:[
  'Un repas par semaine, offert à quelqu\'un qui n\'a rien. Je leur ai dit : ce n\'est pas à {dieu} que vous donnez, c\'est à votre voisin. Et {dieu} compte.',
  'Firmin Roussel a nourri un gamin du port le soir même. Marthe fait un pain de plus chaque jour. Ça coûte. Ça se voit. Et ceux qui reçoivent demandent qui est ce dieu qui nourrit.',
  'Le père Anselme a dit que c\'était de la démagogie. C\'est le meilleur compliment qu\'il m\'ait fait.'
], c:[{l:'Continuer.', fx:{croyants:+2}, go:'j7_fin'}]},

j7_sang: {qui:'p', t:[
  'Je leur ai dit. Chaque mois, une goutte de leur sang sur la pierre que j\'ai posée derrière l\'hôpital. Pas plus. Mais le leur.',
  'Trois sont partis tout de suite. Les autres sont restés, et ceux qui sont restés ont une foi qui fait peur. Firmin a dit : « Enfin un dieu qui prend quelque chose de vrai. »',
  'Dans la ville on commence à nous appeler les Saigneurs. Je ne sais pas si c\'est une insulte.'
], c:[{l:'Continuer.', fx:{croyants:-3, ferveur:+6, foi:+5}, go:'j7_fin'}]},

j7_libre: {qui:'p', t:[
  'Aucune règle. Je leur ai dit : {dieu} ne demande rien, soyez juste là. Ils ont trouvé ça bien. Reposant.',
  'Et le lendemain, la moitié avait oublié de prier. Pas par méchanceté. Parce que rien ne le leur rappelait. Un dieu qui ne demande rien est un dieu qu\'on oublie.',
  'Je continue, moi. Mais je suis le seul à qui ça coûte quelque chose.'
], c:[{l:'Continuer.', fx:{croyants:-2}, go:'j7_fin'}]},

j7_fin: {qui:'monde', t:[
  'Fin de la première semaine. Le temple d\'Ormund a perdu des fidèles pour la première fois depuis sa construction. Le père Anselme a demandé une audience au gouverneur.',
  'Ce que tu as instauré se répètera, chaque jour, pour chaque croyant. C\'est ton revenu. Et c\'est leur fardeau.'
], c:[{l:'Jour 8', go:'j8_epidemie', fx:{jour:8}}]},

/* ---------------- JOUR 8 — l'épidémie ---------------- */
j8_epidemie: {qui:'p', t:[
  'Ça a commencé aux Halles. Une fièvre rouge. Trois morts hier, onze aujourd\'hui. Elle monte vers la colline et descend vers le port. Dans une semaine, ce sera toute la ville.',
  'Le temple a fermé ses portes. Les moines prient à l\'intérieur. Le père Anselme a dit que c\'était une épreuve envoyée par Ormund pour punir les infidèles. Il a dit ton nom.',
  'J\'ai soixante malades dans un hôpital de vingt lits. Et je sais que tu peux. Mais je sais aussi ce que ça coûte.'
], c:[
  {l:'« Guéris-les tous. Tous. Quoi qu\'il en coûte. »', s:'toute ta ferveur · la ville entière saura', fx:{ferveurTout:true, flag:'guerison_totale'}, go:'j8_tous'},
  {l:'« Guéris seulement les nôtres. Que les autres voient la différence. »', s:'4 ferveur · cruel, mais efficace', fx:{ferveur:-4, ombre:+1}, go:'j8_notres'},
  {l:'« Soigne avec tes mains, pas avec moi. Montre-leur un homme. »', s:'gratuit · il va s\'épuiser', fx:{foi:+5}, go:'j8_mains'},
  {l:'« Guéris les enfants. Seulement les enfants. »', s:'5 ferveur · un choix qu\'on n\'oublie pas', fx:{ferveur:-5}, go:'j8_enfants'}
]},

j8_tous: ()=>({qui:'p', t:[
  'J\'ai fait le tour de la ville. Les Halles, la colline, le port, le faubourg. Chaque maison où ça toussait. J\'ai dit ton nom sur chaque front, et j\'ai senti, à chaque fois, quelque chose en toi qui s\'épuisait.',
  'À la fin je n\'avais plus rien. Toi non plus. Mais la fièvre rouge était partie. Pas un mort de plus. Pas un.',
  S.croyants > 15 ? 'La ville entière est sortie dans les rues. Ils ne savaient pas quoi faire. Alors ils ont dit ton nom. Pas comme une prière. Comme un merci.' : 'Les gens sont sortis dans les rues, hébétés. Ils ne savaient pas qui remercier. Certains ont remercié Ormund, par habitude. Les autres ont demandé mon nom, puis le tien.'
], c:[{l:'Continuer.', fx:{croyants:+12, foi:+10}, go:'j8_fin'}]}),

j8_notres: {qui:'p', t:[
  'J\'ai guéri les nôtres. Tous. Marthe, Firmin, les Moreau, les Dufresne. Pas une seule maison de {dieu} n\'a eu un mort.',
  'Et dans les maisons d\'Ormund, ils sont morts. Vingt-trois en quatre jours. On entendait les cloches toute la journée.',
  'Le cinquième jour, il y avait une file devant l\'hôpital. Pas des malades. Des gens qui voulaient changer de dieu avant d\'être malades. Je les ai pris. Tous. Je ne sais pas ce qu\'on est devenus.'
], c:[{l:'Continuer.', fx:{croyants:+9, foi:-5, mort:'vingt-trois habitants des Halles'}, go:'j8_fin'}]},

j8_mains: {qui:'p', t:[
  'Pas de miracle. Des compresses, de l\'eau bouillie, des nuits blanches. Barnabé et moi, et deux infirmières qui ne croient en rien, on a tenu l\'hôpital six jours.',
  'On en a perdu dix-huit. On en a sauvé quarante-deux. Sans toi. Enfin, avec ton nom à chaque lit, mais sans tes mains.',
  'Je suis crevé. Je ne tiens plus debout. Mais ceux qu\'on a sauvés savent que ce n\'est pas tombé du ciel. Ils savent qu\'un homme de {dieu} est resté. Ça vaut peut-être plus qu\'un miracle. Je ne sais pas. Je vais dormir.'
], c:[{l:'Continuer.', fx:{croyants:+5, foi:+10, mort:'dix-huit malades'}, go:'j8_fin'}]},

j8_enfants: {qui:'p', t:[
  'Les enfants. Tous les enfants de la ville, d\'Ormund, de Sélune ou de personne. Trente-six. Pas un seul n\'est mort.',
  'Les adultes, eux, sont morts comme ils devaient mourir. Quatorze. Dont la mère Garnier, qui est venue me voir avant, et qui m\'a dit : « C\'est bien, docteur. Prenez les petits. »',
  'Il y a une chose qu\'on ne pardonne pas à un dieu, c\'est de laisser mourir les enfants. Tu ne l\'as pas fait. Toute la ville l\'a compris. Même le père Anselme a fermé sa bouche.'
], c:[{l:'Continuer.', fx:{croyants:+8, foi:+5, mort:'la mère Garnier'}, go:'j8_fin'}]},

j8_fin: {qui:'monde', t:[
  'Après la fièvre rouge, la ville n\'était plus la même. Le temple d\'Ormund a rouvert ses portes, mais la place devant est restée vide.',
  'Et pour la première fois, quelqu\'un a écrit ton nom sur un mur.'
], c:[{l:'Jour 9', go:'j9_gouverneur', fx:{jour:9}}]},

/* ---------------- JOUR 9 — le gouverneur ---------------- */
j9_gouverneur: {qui:'p', t:[
  'Convocation au palais. Le gouverneur Tancrède Olivier. Un gros homme qui ne croit en rien d\'autre que le calme, et qui n\'aime pas ce qui bouge.',
  '« Docteur. Je me fiche de votre dieu. Je me fiche d\'Ormund. Ce que je n\'aime pas, c\'est qu\'on a eu trois bagarres cette semaine entre vos gens et les leurs, et que le père Anselme me demande votre tête. »',
  '« Je vous propose un arrangement. Votre dieu a le droit d\'exister. Officiellement. Un quartier à vous, le faubourg. En échange, vous ne mettez plus les pieds sur la place du temple, et vous payez l\'impôt des cultes. »'
], c:[
  {l:'« Accepte. Un quartier officiel, c\'est un début. »', s:'la prudence · le faubourg est à toi', fx:{croyants:+4, flag:'faubourg', ferveur:-3}, go:'j9_accepte'},
  {l:'« Refuse. {dieu} ne se laisse pas parquer. »', s:'le courage · le gouverneur devient un ennemi', fx:{foi:+8, flag:'gouv_ennemi'}, go:'j9_refuse'},
  {l:'« Demande la place du temple. Rien de moins. »', s:'l\'audace · il faut quelque chose pour l\'impressionner', fx:{ferveur:-8}, go:'j9_audace'},
  {l:'« Dis-lui que sa femme est malade, et qu\'elle ne le sait pas encore. »', s:'tu le sais, lui non', fx:{ombre:+1, foi:-3}, go:'j9_femme'}
]},

j9_accepte: {qui:'p', t:[
  'J\'ai signé. Le faubourg. Quatre rues, trois cents personnes, des tanneurs, des tisserands, et une église abandonnée qu\'on nous laisse.',
  'Barnabé a nettoyé l\'église en deux jours. Pas d\'autel. Juste un banc, comme celui derrière l\'hôpital. Les gens du faubourg sont venus voir. Ils n\'avaient jamais eu de dieu à eux.',
  'C\'est petit. C\'est légal. C\'est à toi.'
], c:[{l:'Continuer.', go:'j9_fin'}]},

j9_refuse: {qui:'p', t:[
  'J\'ai dit non. J\'ai dit que {dieu} n\'avait pas demandé de permission pour guérir la fièvre rouge et qu\'il n\'en demanderait pas pour exister.',
  'Il m\'a fait sortir par les gardes. Le soir, deux hommes du palais sont venus à l\'hôpital « vérifier les licences ». Ils ont cassé trois fenêtres.',
  'Le lendemain, il y avait cinquante personnes devant l\'hôpital pour empêcher qu\'ils reviennent. Je ne les avais pas appelées.'
], c:[{l:'Continuer.', fx:{croyants:+3}, go:'j9_fin'}]},

j9_audace: {qui:'p', t:[
  'J\'ai demandé la place du temple. Il a ri. Alors j\'ai posé la main sur sa table, j\'ai dit ton nom, et la table de chêne a fleuri. Des bourgeons sur le bois mort. Il a arrêté de rire.',
  '« …Le faubourg et les Halles. Et je ne veux plus jamais voir ça dans mon bureau. »',
  'Deux quartiers. Et un gouverneur qui a peur de toi. Je ne sais pas si c\'est mieux qu\'un gouverneur qui t\'aime. Mais ça marche.'
], c:[{l:'Continuer.', fx:{croyants:+7, flag:'faubourg', flag2:'halles'}, go:'j9_fin'}]},

j9_femme: {qui:'p', t:[
  'Je lui ai dit. « Votre femme a une grosseur sous le bras gauche. Elle ne vous l\'a pas dit. Dans six mois elle sera morte. Dans six mois, ou demain, si {dieu} le veut. »',
  'Il est devenu gris. Il a dit : « Qu\'est-ce que vous voulez ? » J\'ai dit : « Rien. Je guéris votre femme ce soir. Et vous vous souviendrez de qui l\'a fait. »',
  'Je l\'ai guérie. Il n\'a pas dit merci. Mais la convocation a été annulée, et le père Anselme n\'a plus d\'audience au palais. On tient le gouverneur. Par le ventre, comme on dit.'
], c:[{l:'Continuer.', fx:{ferveur:-3, flag:'gouv_tenu'}, go:'j9_fin'}]},

j9_fin: {qui:'monde', t:[
  'La ville a maintenant trois dieux. Un vieux, une discrète, et un nouveau dont on ne sait pas encore très bien s\'il faut l\'aimer ou le craindre.'
], c:[{l:'Jour 10', go:'j10_doute', fx:{jour:10}}]},

/* ---------------- JOUR 10 — le doute ---------------- */
j10_doute: ()=>({qui:'p', t:[
  'Je vais te dire un truc que je ne t\'ai jamais dit.',
  'Hier soir, un gamin est mort. Pas de la fièvre. D\'une connerie, une charrette, la rue des Halles. Il avait huit ans. Je l\'ai eu dans les bras, j\'ai dit ton nom, j\'ai posé les mains. Et rien.',
  'Rien. Pour la première fois, rien. Alors je te demande, {dieu}, et je veux la vérité : est-ce que tu ne pouvais pas, ou est-ce que tu n\'as pas voulu ?'
], c:[
  {l:'« Je ne pouvais pas. Il était déjà parti. »', s:'la vérité', fx:{foi:+5}, go:'j10_verite'},
  {l:'« Je ne voulais pas. Il faut que la ville sache que je ne sauve pas tout le monde. »', s:'une autre vérité', fx:{foi:-5, ombre:+1}, go:'j10_dur'},
  {l:'« Tu étais fatigué. Ce n\'est pas moi qui ai échoué. »', s:'le mensonge', fx:{foi:-12}, go:'j10_mensonge'},
  {l:'Ne pas répondre.', s:'les dieux ne rendent pas de comptes', fx:{foi:-8}, go:'j10_silence'}
]}),

j10_verite: {qui:'p', t:[
  'Déjà parti. D\'accord.',
  'Tu sais, Ormund n\'a jamais dit ça. Ormund ne disait rien, jamais, et on remplissait les blancs avec de l\'espoir. Toi, tu dis « je ne pouvais pas ». C\'est la première fois qu\'un dieu me dit qu\'il a des limites.',
  'Ça devrait me faire douter. Ça fait l\'inverse. Je sais à quoi je crois, maintenant. Pas à un dieu qui peut tout. À un dieu qui essaie.'
], c:[{l:'Continuer.', go:'j10_fin'}]},

j10_dur: {qui:'p', t:[
  'Tu n\'as pas voulu.',
  'Je vais rester ton prophète, {dieu}. Parce que j\'ai donné trop pour reculer. Mais je ne te regarderai plus de la même façon. Et je sais maintenant qu\'un jour, quand ce sera moi dans la charrette, tu feras peut-être le même calcul.',
  'C\'est peut-être ça, un vrai dieu. Je préférais quand je ne le savais pas.'
], c:[{l:'Continuer.', go:'j10_fin'}]},

j10_mensonge: {qui:'p', t:[
  'Fatigué. Moi.',
  'Je l\'étais. C\'est vrai. Mais j\'ai été fatigué toute ma vie, et tu as guéri la fièvre rouge avec mes mains fatiguées. Ne me fais pas ça. Ne me mets pas ça sur le dos.',
  'Je vais boire ce soir. Pas beaucoup. Juste assez pour ne pas penser que mon dieu ment comme les autres.'
], c:[{l:'Continuer.', fx:{flag:'rechute'}, go:'j10_fin'}]},

j10_silence: {qui:'p', t:[
  'Rien. Comme la première nuit.',
  'Tu sais ce que ça fait, le silence, quand on a déjà entendu ? C\'est pire que de ne jamais avoir entendu. Ormund se taisait et je m\'en foutais. Toi tu te tais et ça me tue.',
  'Je vais continuer. Mais Barnabé m\'a trouvé sur le banc ce matin, et il a dit que j\'avais la tête de la première nuit. Il a raison.'
], c:[{l:'Continuer.', go:'j10_fin'}]},

j10_fin: {qui:'monde', t:[
  'La foi d\'un prophète ne se mesure pas aux miracles qu\'il a vus. Elle se mesure à ce qu\'il fait quand il n\'y en a pas.'
], c:[{l:'Jour 11', go:'j11_selune', fx:{jour:11}}]},

/* ---------------- JOUR 11 — Sélune ---------------- */
j11_selune: {qui:'p', t:[
  'Une vieille est venue me voir. Ondine, la doyenne du port, celle qui jette les fleurs à Sélune depuis soixante ans. Elle a demandé à me parler seule.',
  '« Docteur. Sélune ne m\'a jamais parlé. Mais elle a toujours été là, dans l\'eau, dans la pluie, dans le poisson qui revient. Elle ne guérit pas. Elle ne punit pas. Elle est. Vos gens disent au port qu\'elle n\'existe pas. »',
  '« Je ne viens pas me battre. Je viens vous demander : est-ce que votre dieu a besoin que le mien meure ? »'
], c:[
  {l:'« Non. Dis-lui que {dieu} et Sélune peuvent partager le port. »', s:'la paix · moins de croyants, mais une alliée', fx:{foi:+5, flag:'selune_alliee'}, go:'j11_paix'},
  {l:'« Oui. Un seul dieu par ville. Prends le port. »', s:'la conquête · +8 croyants, et une vieille en pleurs', fx:{croyants:+8, ombre:+1}, go:'j11_conquete'},
  {l:'« Demande-lui si Sélune lui a déjà donné un signe. Un seul. »', s:'la question qui tue', fx:{croyants:+3}, go:'j11_question'}
]},

j11_paix: {qui:'p', t:[
  'Je lui ai dit que tu n\'avais pas besoin de tuer qui que ce soit. Que la rivière pouvait rester à Sélune et les malades à {dieu}.',
  'Elle a pleuré. Pas de tristesse. Elle a dit que personne, en soixante ans, ne lui avait parlé de Sélune comme si elle existait vraiment. Elle a dit qu\'elle jetterait une fleur pour toi, demain, avec les autres.',
  'Le port ne sera jamais entièrement à toi. Mais il ne sera jamais contre toi non plus. Et quand le père Anselme viendra prêcher ta mort au port, c\'est Ondine qui lui fermera sa porte.'
], c:[{l:'Continuer.', fx:{croyants:+2}, go:'j11_fin'}]},

j11_conquete: {qui:'p', t:[
  'Je lui ai dit la vérité telle que tu la vois : une ville, un dieu. Elle n\'a rien répondu. Elle est repartie vers le port avec son panier de fleurs.',
  'Le lendemain, Barnabé a prêché sur les quais. Il a été bon. Trop bon. Le soir, il n\'y avait plus une fleur sur l\'eau. Ondine est restée chez elle.',
  'On a pris le port. Je te le donne. Mais je ne vais pas te dire que j\'ai aimé ça.'
], c:[{l:'Continuer.', fx:{foi:-5}, go:'j11_fin'}]},

j11_question: {qui:'p', t:[
  'Je lui ai demandé : « En soixante ans, est-ce que Sélune vous a répondu une seule fois ? »',
  'Elle a réfléchi longtemps. Elle a dit : « Non. Mais je n\'ai jamais demandé. » Alors j\'ai dit : « Demandez-lui ce soir. Et demandez à {dieu} aussi. Et voyez qui répond. »',
  'Elle est venue me voir ce matin. Elle n\'a rien dit. Elle m\'a tendu une fleur. Je crois que c\'était pour toi.'
], c:[{l:'Continuer.', fx:{flag:'selune_alliee'}, go:'j11_fin'}]},

j11_fin: {qui:'monde', t:[
  'Le port a toujours été le quartier des gens qui attendent. Les marins, les veuves, les enfants qui regardent l\'eau. Ce qu\'ils attendent a peut-être changé de nom.'
], c:[{l:'Jour 12', go:'j12_procession', fx:{jour:12}}]},

/* ---------------- JOUR 12 — la procession ---------------- */
j12_procession: ()=>({qui:'p', t:[
  flag('disc_espion') ? 'Barnabé avait raison. La grande procession d\'Ormund, c\'est demain. Et le miracle est préparé : une statue qui pleure. Un tuyau dans la pierre, un moine derrière avec une outre d\'eau salée. Toute la ville est invitée.'
                      : 'Le temple a affiché partout : grande procession d\'Ormund, demain. Un miracle est annoncé. La statue du Vieux Dieu pleurera pour les péchés de la ville. Toute la ville est invitée. Nous aussi, officiellement.',
  'Le père Anselme veut reprendre la ville en un jour. Si la statue pleure devant deux mille personnes, la moitié des nôtres retournera à Ormund par peur.',
  'Dis-moi quoi faire.'
], c:[
  {l:'« Vas-y. Et quand la statue pleurera, fais-la rire. »', s:'8 ferveur · l\'humiliation publique', fx:{ferveur:-8, flag:'statue_rit'}, go:'j12_rire'},
  flag('disc_espion') ? {l:'« Dénonce le tuyau. Devant tout le monde. Avant qu\'elle pleure. »', s:'gratuit · la vérité suffit', fx:{foi:+5}, go:'j12_tuyau'} : {l:'« Vas-y, et soigne quelqu\'un dans la foule pendant qu\'ils regardent la statue. »', s:'4 ferveur · un vrai miracle contre un faux', fx:{ferveur:-4}, go:'j12_vrai'},
  {l:'« N\'y va pas. Fais une fête au faubourg le même jour. »', s:'6 ferveur · la concurrence', fx:{ferveur:-6}, go:'j12_fete'},
  {l:'« Vas-y, agenouille-toi avec eux, et laisse la statue pleurer. »', s:'l\'humilité', fx:{foi:+3}, go:'j12_genoux'}
]}),

j12_rire: {qui:'p', t:[
  'Deux mille personnes sur la place. La statue d\'Ormund, trois mètres de pierre, et le père Anselme en robe d\'or. Les cloches. Les chants. Et puis les larmes : deux filets d\'eau sur les joues de pierre. La foule a hurlé.',
  'Et j\'ai dit ton nom. Et la bouche de pierre s\'est ouverte. Et la statue a ri. Un rire énorme, de pierre, qui a fait trembler les vitres du temple.',
  'Le père Anselme s\'est évanoui. Les moines ont fui. La foule, elle, a mis dix secondes à comprendre, puis elle a ri avec la statue. Deux mille personnes qui rient d\'Ormund. Il ne s\'en relèvera pas.'
], c:[{l:'Continuer.', fx:{croyants:+20, flag:'ormund_fini'}, go:'j12_fin'}]},

j12_tuyau: {qui:'p', t:[
  'J\'ai attendu que les cloches sonnent. J\'ai monté les marches avant que le père Anselme ouvre la bouche. J\'ai dit : « Avant que vous pleuriez, mon père, laissez-moi vous montrer quelque chose. »',
  'J\'ai fait le tour de la statue. J\'ai tiré le rideau. Le moine était là, l\'outre à la main, le tuyau dans la pierre. Deux mille personnes ont vu.',
  'Je n\'ai pas eu besoin de toi. Juste d\'un rideau. Le père Anselme n\'a pas dit un mot. Il est rentré dans son temple et il a fermé la porte. On ne l\'a pas revu.'
], c:[{l:'Continuer.', fx:{croyants:+15, flag:'ormund_fini'}, go:'j12_fin'}]},

j12_vrai: {qui:'p', t:[
  'La statue a pleuré. La foule a crié. Et pendant qu\'ils regardaient en l\'air, j\'ai trouvé dans la foule un aveugle de naissance, Victorin Picard, le fils du tanneur, et j\'ai dit ton nom en lui prenant la tête.',
  'Il a crié plus fort que tous les autres. Parce qu\'il voyait. Pour la première fois. Il voyait la statue, le prêtre, le ciel, et il hurlait « c\'est quoi ça, c\'est quoi ça ».',
  'Les gens autour ont compris avant le prêtre. Un faux miracle en l\'air, un vrai au milieu d\'eux. La procession s\'est finie en bagarre. On a gagné la bagarre.'
], c:[{l:'Continuer.', fx:{croyants:+10}, go:'j12_fin'}]},

j12_fete: {qui:'p', t:[
  'On a fait la fête au faubourg. Marthe a fait du pain pour trois cents. Firmin a sorti un tonneau. Barnabé a chanté, et il chante mal, et c\'était parfait.',
  'La moitié de la ville est venue à la procession. L\'autre moitié est venue chez nous, parce qu\'il y avait du pain et pas de sermon. La statue a pleuré devant une place à moitié vide.',
  'Le père Anselme a dit que c\'était un sacrilège. Il avait la voix d\'un homme qui a perdu.'
], c:[{l:'Continuer.', fx:{croyants:+8, foi:+5}, go:'j12_fin'}]},

j12_genoux: {qui:'p', t:[
  'Je me suis mis à genoux avec eux. Au premier rang. Le père Anselme m\'a vu. Il n\'a pas compris.',
  'La statue a pleuré. Les gens ont prié. Et moi, à genoux devant Ormund, j\'ai dit ton nom tout bas. Les gens autour de moi l\'ont entendu. Ils ont vu le prophète de {dieu} à genoux sans peur devant le vieux dieu.',
  'Je crois que c\'est ça qui a fait le plus de mal au prêtre. Pas un miracle. Un homme qui n\'avait plus besoin de le combattre.'
], c:[{l:'Continuer.', fx:{croyants:+5, foi:+5}, go:'j12_fin'}]},

j12_fin: {qui:'monde', t:[
  'Le lendemain, les cloches du temple d\'Ormund n\'ont pas sonné. Pour la première fois en mille ans.'
], c:[{l:'Jour 13', go:'j13_bete2', fx:{jour:13}}]},

/* ---------------- JOUR 13 — le retour de la bête ---------------- */
j13_bete2: ()=>({qui:'p', t:[
  'Elle est revenue. La bête. Pas sur la colline : en ville. Dans le faubourg. Chez nous.',
  'Elle a tué deux tanneurs cette nuit et elle a emporté Barnabé.',
  'Pas tué. Emporté. On a suivi les traces jusqu\'au vieux moulin, au bord de la rivière. Il est vivant, on l\'entend. Elle attend. Elle attend quoi, {dieu} ? Elle attend qui ?'
], c:[
  {l:'« Elle m\'attend. Vas-y avec tous les croyants. Je serai avec vous. »', s:'10 ferveur · la guerre sainte', fx:{ferveur:-10, flag:'bete_vaincue'}, go:'j13_tous'},
  {l:'« Vas-y seul. Comme la première fois. »', s:'il peut mourir pour de bon', go:'j13_seul'},
  {l:'« Offre-lui quelque chose. Un dieu peut parler à une bête. »', s:'la voie de l\'ombre · tu sais ce qu\'elle veut', fx:{ombre:+1}, go:'j13_pacte'},
  {l:'« Laisse Barnabé. Un disciple de moins, c\'est tous les autres sauvés. »', s:'le calcul', fx:{foi:-15, mort:'Barnabé', ombre:+1}, go:'j13_laisse'}
]}),

j13_tous: ()=>({qui:'p', t:[
  `On y est allés à ${Math.min(S.croyants, 80)}. Avec des torches, des fourches, des couteaux de tanneur. Marthe avec son rouleau à pâtisserie, je te jure. Firmin devant.`,
  'La bête est sortie du moulin. Grande comme une maison. Les gens ont reculé. Et puis j\'ai dit ton nom, et tous l\'ont répété, et la lumière des torches est devenue blanche.',
  'Elle a brûlé. Pas de flammes. Juste de la lumière, et elle a hurlé, et elle a fondu dans la rivière. Barnabé était dans le moulin, une jambe cassée, vivant. Il a dit : « J\'ai entendu. Il nous a entendus. » Toute la ville a vu la lumière.'
], c:[{l:'Continuer.', fx:{croyants:+15, foi:+10}, go:'j13_fin'}]}),

j13_seul: ()=>{
  const sobre = flag('sobre'), fort = S.foi>=70;
  if(fort) return {qui:'p', t:[
    'J\'y suis allé seul. Sans fusil cette fois. Avec ta croix et mon stéthoscope, comme un con.',
    'Elle est sortie. Je l\'ai regardée dans les yeux, et je n\'ai pas eu peur. C\'est ça qui l\'a arrêtée. Elle a reniflé. Elle a reculé. Elle a lâché Barnabé dans la boue et elle est partie vers les collines, lentement, comme un vieux chien.',
    'Je ne sais pas ce que j\'ai fait. Je crois que je n\'ai rien fait. Je crois que j\'étais simplement plein de toi, et qu\'elle l\'a senti.'
  ], c:[{l:'Continuer.', fx:{croyants:+6, foi:+10, flag:'bete_partie'}, go:'j13_fin'}]};
  return {qui:'p', t:[
    'J\'y suis allé seul. J\'avais peur. J\'avais tellement peur que je tremblais, et elle l\'a senti.',
    'Elle m\'a ouvert le ventre. J\'ai eu le temps de dire ton nom, de jeter ma croix à Barnabé, et de le voir ramper dehors pendant qu\'elle était sur moi. Il est vivant. Moi… moi, c\'est autre chose.',
    'Barnabé est ton prophète, maintenant. Il est jeune. Il croit. Prends soin de lui mieux que de moi. Adieu, {dieu}. C\'était bien.'
  ], c:[{l:'Continuer.', fx:{mort:'Aurèle Vauclair', flag:'aurele_mort', foi:-20, croyants:+4}, go:'j13_fin'}]};
},

j13_pacte: {qui:'p', t:[
  'Je suis allé au moulin, seul, les mains vides. J\'ai dit ton nom. Et tu as parlé. Pas à moi. À elle.',
  'Je n\'ai pas compris les mots. Mais j\'ai compris le marché : la bête est à toi, maintenant. Elle ne touchera plus aux tiens. Elle touchera aux autres. Elle a lâché Barnabé et elle m\'a regardé comme on regarde un collègue.',
  'La ville sera à toi vite, {dieu}. Très vite. Les gens ont compris qu\'il valait mieux être du bon côté de la bête. Mais ce n\'est plus de la foi. C\'est de la peur avec un nom.'
], c:[{l:'Continuer.', fx:{croyants:+18, foi:-10, flag:'bete_pacte'}, go:'j13_fin'}]},

j13_laisse: {qui:'p', t:[
  'On l\'a entendu toute la nuit. Il a appelé ton nom jusqu\'à l\'aube. Puis il a appelé le mien. Puis plus rien.',
  'Au matin, la bête était partie. Elle avait ce qu\'elle voulait. Les tanneurs sont saufs. Le faubourg est sauf. Tu as fait le calcul, et le calcul était juste.',
  'Je ne t\'en parlerai plus jamais. Mais je ne dirai plus jamais ton nom en souriant.'
], c:[{l:'Continuer.', go:'j13_fin'}]},

j13_fin: {qui:'monde', t:[
  'Les bêtes ne viennent pas de nulle part. Celle-là est venue parce qu\'un dieu nouveau grandissait, et que quelque chose, quelque part, n\'aimait pas ça.',
  'Il y a d\'autres dieux que les deux de cette ville. Tu viens de rencontrer le premier.'
], c:[{l:'Jour 14', go:'j14_temple', fx:{jour:14}}]},

/* ---------------- JOUR 14 — le temple ---------------- */
j14_temple: ()=>{
  const mortA = flag('aurele_mort');
  const qui = mortA ? 'Barnabé' : null;
  return {qui:'p', nomQui:qui, t:[
    mortA ? 'C\'est Barnabé. Je… je reprends là où Aurèle s\'est arrêté. Il m\'a laissé sa croix et une liste de malades. Je fais ce que je peux. Et ce matin, le conseil de la ville est venu me voir.'
          : 'Le conseil de la ville est venu à l\'hôpital. Le gouverneur, les marchands, et même deux vieux moines d\'Ormund qui ne savent plus à qui prier.',
    `« ${S.croyants} personnes suivent ${S.nom}. C\'est plus qu\'Ormund. Un dieu de cette taille doit avoir un lieu. Nous offrons de le bâtir. » Un temple, {dieu}. Pour toi.`,
    'Ils m\'ont demandé où, et comment. Et je ne sais pas ce que tu veux. Je sais ce qu\'Ormund voulait : du marbre, de l\'or, et des marches pour qu\'on se sente petit.'
  ], c:[
    {l:'« Sur la place, à la place de celui d\'Ormund. En marbre. »', s:'la puissance · 15 ferveur', fx:{ferveur:-15, croyants:+10, flag:'temple_marbre'}, go:'j14_marbre'},
    {l:'« L\'hôpital. Le temple de {dieu}, c\'est l\'hôpital. Agrandissez-le. »', s:'le soin · 8 ferveur', fx:{ferveur:-8, croyants:+6, foi:+10, flag:'temple_hopital'}, go:'j14_hopital'},
    {l:'« Pas de temple. Un banc. Derrière l\'hôpital. Celui de la première nuit. »', s:'l\'humilité · gratuit', fx:{foi:+15, flag:'temple_banc'}, go:'j14_banc'},
    {l:'« Un temple noir. Au bord de la rivière. Là où la bête est entrée dans l\'eau. »', s:'l\'ombre · 12 ferveur', fx:{ferveur:-12, croyants:+8, ombre:+2, flag:'temple_noir'}, go:'j14_noir'}
  ]};
},

j14_marbre: {qui:'p', t:[
  'Ils ont abattu le temple d\'Ormund en une semaine. Les moines ont regardé, puis ils ont aidé, parce qu\'il fallait bien manger. La statue qui pleurait est partie en morceaux dans la rivière.',
  'Le tien monte. Blanc. Haut. Des marches, parce que les marchands ont insisté. Je monte dessus chaque matin et je me sens petit, moi aussi.',
  'Tu es devenu un grand dieu, {dieu}. Comme Ormund. J\'espère que tu te souviens du banc.'
], c:[{l:'Continuer.', go:'j15_fin'}]},

j14_hopital: {qui:'p', t:[
  'Cent lits. Des fenêtres qui ferment. Une salle pour les enfants, une pour les contagieux. Et au milieu, pas d\'autel : une table d\'opération.',
  'Les gens viennent prier ici. Entre les lits. Ils disent ton nom en tenant la main d\'un malade. C\'est le seul temple au monde où on prie en travaillant.',
  'Le père Anselme est venu, un soir, sans sa robe. Il a demandé s\'il pouvait aider. Je lui ai donné un seau. Il a dit merci.'
], c:[{l:'Continuer.', fx:{croyants:+5}, go:'j15_fin'}]},

j14_banc: {qui:'p', t:[
  'Je leur ai dit : le banc. Ils ont cru que je plaisantais. Le gouverneur a dit que ce n\'était pas sérieux, qu\'un dieu sans temple n\'était pas un dieu.',
  'Alors je les ai emmenés derrière l\'hôpital. Il y avait quarante personnes assises par terre autour du banc, à trois heures de l\'après-midi, qui disaient ton nom en regardant le ciel. Sans que personne le leur ait demandé.',
  'Le gouverneur s\'est tu. On n\'a pas de temple, {dieu}. On a quelque chose que les temples n\'ont jamais eu.'
], c:[{l:'Continuer.', fx:{croyants:+8}, go:'j15_fin'}]},

j14_noir: {qui:'p', t:[
  'Pierre noire, sans fenêtres, au bord de l\'eau. Là où la bête est entrée. Les gens n\'y entrent pas. Ils déposent des choses devant la porte, la nuit, et ils repartent vite.',
  'Je suis le seul à y entrer. Il y fait froid. Je t\'y sens plus fort qu\'ailleurs, et différent. Plus vieux. Je ne sais pas ce que tu deviens, {dieu}.',
  'La ville est à toi. Toute. Mais quand je passe dans la rue, les enfants se cachent.'
], c:[{l:'Continuer.', go:'j15_fin'}]},

/* ---------------- JOUR 15 — la fin de la première histoire ---------------- */
j15_fin: ()=>({qui:'monde', t:[
  'Quinze jours. Il y a quinze jours, tu n\'avais pas de nom, et un médecin ivre te parlait sur un banc.',
  `Aujourd\'hui, ${S.croyants} personnes disent ton nom chaque matin. Le temple d\'Ormund ${flag('ormund_fini')?'est fermé':'tient encore, à peine'}. ${flag('selune_alliee')?'Sélune jette des fleurs pour toi.':'Sélune se tait.'}`,
  S.mort.length ? `Et ${S.mort.length===1?'une personne est morte':S.mort.length+' morts jalonnent'} sur le chemin : ${S.mort.join(', ')}.` : 'Et personne n\'est mort sur le chemin. Personne.'
], c:[{l:'Voir ce que tu es devenu.', go:'fin'}]}),

fin: ()=>{
  const o=S.ombre, f=S.foi, c=S.croyants;
  let titre, texte;
  if(flag('aurele_mort')) { titre='Le dieu orphelin'; texte='Ton prophète est mort pour toi. Barnabé porte sa croix, et la ville porte ton nom. Mais chaque fois qu\'on te prie, c\'est le banc vide qu\'on regarde. Tu as appris ce que coûte un homme. Ne l\'oublie pas pour le suivant.'; }
  else if(o>=5) { titre='Le dieu de la peur'; texte='La ville est à toi. Entière. Les enfants se cachent quand passe ton prophète, et personne ne prononce ton nom en souriant. Tu as gagné vite, et tu as gagné tout. Un jour, quelqu\'un d\'autre arrivera, sur un banc, et parlera à ceux que tu as fait trembler. C\'est ainsi que les dieux de la peur finissent : par un nouveau dieu.'; }
  else if(f>=85 && o<=1) { titre='Le dieu du banc'; texte='Tu n\'as pas voulu de marbre. Tu as voulu un homme, et il t\'a cru. La ville ne t\'a pas suivi parce que tu étais fort, mais parce que tu étais là. On dit, dans les quartiers, qu\'on peut te parler. C\'est la chose la plus rare qu\'on puisse dire d\'un dieu.'; }
  else if(c>=60) { titre='Le dieu nouveau'; texte='Tu as pris la ville en quinze jours, par les miracles et par les choix. Tu as des croyants, un lieu, un prophète fatigué et fidèle. Tu es devenu ce qu\'Ormund était il y a mille ans : un dieu qui compte. Reste à savoir ce que tu feras quand on commencera à te décevoir.'; }
  else { titre='Le dieu discret'; texte='Tu n\'as pas pris la ville. Tu as pris quelques maisons, un hôpital, et le cœur d\'un homme qui ne croyait plus en rien. C\'est peu. C\'est exactement ce que les grands dieux ont eu, au début. La suite est à écrire.'; }
  return {fin:true, titre, texte};
}
};

/* ============================================================
   LE MOTEUR
   ============================================================ */
function noeud(){ let n=N[S.noeud]; if(typeof n==='function') n=n(); return n; }
function appliquer(fx, ancre){
  if(!fx) return;
  const d={};
  if(fx.ferveurTout){ d.ferveur=-S.ferveur; S.ferveur=0; }
  if(fx.ferveur){ d.ferveur=fx.ferveur; S.ferveur=Math.max(0,S.ferveur+fx.ferveur); }
  if(fx.croyants){ d.croyants=fx.croyants; S.croyants=Math.max(1,S.croyants+fx.croyants); }
  if(fx.foi){ S.foi=Math.max(0,Math.min(100,S.foi+fx.foi)); }
  if(fx.ombre){ S.ombre+=fx.ombre; }
  if(fx.flag) set(fx.flag); if(fx.flag2) set(fx.flag2);
  if(fx.mort) S.mort.push(fx.mort);
  if(fx.jour){ S.jour=fx.jour; // revenu quotidien des croyants
    const dogme = flag('dogme_sang')?4:flag('dogme_repas')?2:flag('dogme_priere')?1:0;
    const gain = Math.round(S.croyants*dogme*0.25) + (flag('sobre')?1:0);
    if(gain){ S.ferveur+=gain; d.ferveur=(d.ferveur||0)+gain; }
  }
  return d;
}
function choisir(i){
  const n=noeud(); const ch=n.c[i]; if(!ch) return;
  S.histo.push(S.noeud);
  const d=appliquer(ch.fx);
  S.noeud=ch.go;
  save(); render(d);
}
function recommencer(){ localStorage.removeItem(SAVE_KEY); S=null; render(); }

/* ---------- rendu ---------- */
const app=document.getElementById('app');
function render(delta){
  if(!S) return renderSetup();
  const n=noeud();
  if(n.fin) return renderFin(n);
  const qui = n.qui==='monde' ? '' : (n.nomQui || (flag('aurele_mort') ? 'Barnabé' : P.nom));
  const portrait = flag('aurele_mort') ? `<div class="vide">Barnabé, qui porte la croix d'Aurèle</div>` : `<img src="prophete.png" alt="" onerror="this.outerHTML='<div class=vide>prophete.png manquant</div>'">`;
  app.innerHTML=`
  <header>
    <div class="nom">${S.nom}<small>Jour ${S.jour} · v${VERSION}</small></div>
    <div class="compteurs">
      <div class="cpt gold" id="c-ferveur"><b>${S.ferveur}</b><small>ferveur</small></div>
      <div class="cpt rose" id="c-croyants"><b>${S.croyants}</b><small>croyants</small></div>
    </div>
  </header>
  <div class="scene">
    <div class="portrait">${n.qui==='monde'?'<div class="vide"></div>':portrait}<button class="menu" onclick="if(confirm('Recommencer l\\'histoire depuis le début ?'))recommencer()">↻</button>${n.qui!=='monde'?`<div class="etat">foi ${S.foi}${S.ombre>=3?' · ombre':''}</div>`:''}</div>
    <div class="dialogue">
      <div class="qui ${n.qui==='monde'?'monde':''}">${n.qui==='monde'?'— le monde —':qui}</div>
      <div class="texte">${n.t.map(p=>`<p>${T(p)}</p>`).join('')}</div>
      <div class="choix">${n.c.map((c,i)=>`<button class="${/^(Continuer|Jour|Écouter|Voir)/.test(c.l)?'suite':''}" onclick="choisir(${i})">${T(c.l)}${c.s?`<small>${T(c.s)}</small>`:''}</button>`).join('')}</div>
    </div>
  </div>`;
  if(delta){ ['ferveur','croyants'].forEach(k=>{ if(delta[k]){ const el=document.getElementById('c-'+k); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),300); const sp=document.createElement('span'); sp.className='delta'; sp.style.color=delta[k]>0?'var(--good)':'var(--bad)'; sp.textContent=(delta[k]>0?'+':'')+delta[k]; el.style.position='relative'; el.appendChild(sp); setTimeout(()=>sp.remove(),1300); } }); }
  document.querySelector('.dialogue').scrollTop=0;
}
function renderFin(n){
  app.innerHTML=`<header><div class="nom">${S.nom}<small>Fin de la première histoire</small></div><div class="compteurs"><div class="cpt gold"><b>${S.ferveur}</b><small>ferveur</small></div><div class="cpt rose"><b>${S.croyants}</b><small>croyants</small></div></div></header>
  <div class="fin"><h1>${n.titre}</h1><p>${T(n.texte)}</p>
  <p style="color:var(--quiet);font-size:13px">Foi finale du prophète : ${S.foi}. Part d'ombre : ${S.ombre}. ${S.mort.length?'Morts : '+S.mort.join(', ')+'.':'Aucun mort.'}</p>
  <button onclick="recommencer()">Recommencer avec un autre nom</button></div>`;
}
function renderSetup(){
  const anc = localStorage.getItem(SAVE_KEY);
  app.innerHTML=`<div class="setup">
    <h1>Le jeu du dieu</h1>
    <p>Tu viens de naître. Tu n'as pas de temple, pas de prêtre, et personne ne connaît ton nom. Quelque part dans une ville de deux mille âmes, un homme est en train de maudire son dieu. Il va t'entendre.</p>
    <label>Ton nom</label><input id="nom" placeholder="Ilyra, Vorn, Aëlis…" maxlength="16">
    <button class="go" onclick="demarrer()">Naître</button>
    <p style="font-size:12px;margin-top:24px">Un jeu narratif. Quinze journées, des choix qui coûtent, et un dieu qui devient ce que tu en fais. Version ${VERSION}.</p>
  </div>`;
  setTimeout(()=>{const i=document.getElementById('nom'); if(i) i.focus();},100);
}
function demarrer(){ const nom=document.getElementById('nom').value.trim(); if(!nom) return alert('Il te faut un nom.'); S=def(); S.nom=nom; save(); render(); }

(function(){ try{ const s=localStorage.getItem(SAVE_KEY); if(s){ S=JSON.parse(s); if(S.version!==VERSION) S=null; } }catch(e){ S=null; } render(); })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jeu du dieu</title>
<style>
:root{--bg:#14161c;--card:#1e2129;--line:#2d313c;--ink:#ecebe4;--quiet:#9a9c9a;--gold:#e0b45c;--good:#6fbf73;--bad:#d96b5c;--violet:#b48be0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:130px}
header{padding:10px 14px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
header h1 small{font-size:11px;color:var(--quiet);font-weight:400}
.stats{display:flex;gap:6px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;flex:1;text-align:center}
.stat b{display:block;font-size:17px}
.stat.gold b{color:var(--gold)}
.stat.pro{border-color:var(--gold)}
main{padding:14px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--quiet);padding:8px 2px 6px;font-size:12px;position:relative}
nav button.on{color:var(--gold)}
nav button span{display:block;font-size:20px}
nav button i{position:absolute;top:4px;right:14px;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:0 5px}
/* conversation */
.msg{margin-bottom:12px;max-width:92%}
.msg.p{margin-right:auto}
.msg.toi{margin-left:auto;text-align:right}
.msg .b{display:inline-block;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.msg.toi .b{background:#4a3d1a;border-color:#6b5726}
.msg.monde .b{background:transparent;border:0;color:var(--quiet);font-size:13px;padding:2px 0}
.msg.imp .b{border-color:var(--gold)}
.msg small.q{display:block;font-size:11px;color:var(--quiet);margin:0 0 3px 4px}
.msg .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .ch button{background:var(--gold);color:#1a1200;border:0;border-radius:9px;padding:8px 12px;font-weight:600;font-size:14px}
.msg .ch button.sec{background:#33363f;color:var(--ink);font-weight:400}
.msg .ch button:disabled{opacity:.4}
.msg .done{font-size:12px;color:var(--quiet);margin-top:6px;font-style:italic}
/* barre de parole */
.parole{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;z-index:6}
.parole button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 4px;font-size:13px}
.parole button.on{border-color:var(--gold);color:var(--gold)}
.sheet{position:fixed;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom));max-height:60vh;overflow:auto;background:var(--card);border-top:1px solid var(--gold);padding:12px 14px;z-index:7;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.sheet h3{margin:0 0 8px;font-size:14px;color:var(--gold);display:flex;justify-content:space-between}
.sheet h3 span{color:var(--quiet);font-weight:400;font-size:12px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.opt b{display:block;font-size:15px}
.opt small{display:block;color:var(--quiet);font-size:12px}
.opt button{background:var(--gold);color:#1a1200;border:0;border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap}
.opt button:disabled{background:#33363f;color:var(--quiet)}
.opt.lock b{color:var(--quiet)}
.sel{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;margin:8px 0}
/* village */
h2{font-size:14px;color:var(--quiet);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
h2:first-child{margin-top:0}
.gauge{margin-bottom:10px}
.gauge div.lbl{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;background:#2b3040;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.warn{background:var(--gold)}.bar i.bad{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.row small{color:var(--quiet);display:block;font-size:12px}
.foi{font-size:12px;padding:2px 7px;border-radius:9px;background:#2b3040;white-space:nowrap}
.foi.me{background:#4a3d1a;color:var(--gold)}
.foi.doubt{background:#4a2a2a;color:#f0a0a0}
.famille{margin-top:14px}
.famille h3{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between}
.famille h3 small{color:var(--quiet);font-weight:400}
.log{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.log small{color:var(--quiet);margin-right:6px;white-space:nowrap}
.log.imp{color:var(--gold)}
.setup{padding:20px 16px}
.setup label{display:block;margin:14px 0 6px;color:var(--quiet);font-size:13px}
.setup input,.setup select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.setup .go{margin-top:24px;width:100%;padding:14px;background:var(--gold);border:0;border-radius:10px;font-size:17px;font-weight:600}
.toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#2b3040;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
.toast.on{opacity:1}
.test{margin-top:24px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--quiet)}
.test button{background:#33363f;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;margin:4px 4px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   LE JEU DU DIEU — prototype v3
   Tu ne vois le village que par ton prophète.
   Foi = jusqu'où quelqu'un irait pour toi.
   Ferveur = ta ressource, gagnée par les sacrifices et les dogmes.
   ============================================================ */
const VERSION = 3;
const TICK_MS = 10*60*1000;
const TICKS_PAR_JOUR = 6;
const SAVE_KEY = 'jeu-du-dieu-v3';

const ELEMENTS = {eau:'Eau', feu:'Feu', terre:'Terre', vent:'Vent', lumiere:'Lumière', ombre:'Ombre'};
const VALEURS  = {justice:'Justice', liberte:'Liberté', partage:'Partage', ambition:'Ambition', ordre:'Ordre', chaos:'Chaos'};
const MANIERES = {doux:'Doux', brutal:'Brutal', visible:'Visible', discret:'Discret'};
const SAISONS = [{n:'Printemps',k:1.1,e:'🌱'},{n:'Été',k:1.3,e:'☀️'},{n:'Automne',k:0.9,e:'🍂'},{n:'Hiver',k:0.45,e:'❄️'}];
const JOURS_PAR_SAISON = 8;

const PRENOMS = ['Marthe','Odile','Gaspard','Léon','Brune','Thibault','Aurèle','Mahaut','Colin','Sidonie','Baptiste','Rosalie','Anselme','Iris','Firmin','Jeanne','Ambroise','Lison','Barnabé','Hortense','Côme','Perrine','Eloi','Flavie','Armand','Blanche','Casimir','Delphine','Émile','Faustine','Gautier','Honorine','Isidore','Joséphine','Lazare','Marceline','Nestor','Ondine','Philibert','Quitterie','Rémi','Solange','Tancrède','Ursule','Victorin','Wilhelmine','Zéphyr','Agathe'];
const FAMILLES = ['Vauclair','Moreau','Dufresne','Lambert','Roussel','Garnier','Perrault','Lenoir'];
const METIERS  = ['fermier','pêcheur','boulanger','forgeron','soigneur','soldat','marchand','tisserand','bûcheron','berger'];
const EMOJI = {fermier:'🌾',pêcheur:'🎣',boulanger:'🍞',forgeron:'⚒️',soigneur:'🌿',soldat:'🛡️',marchand:'⚖️',tisserand:'🧵',bûcheron:'🪓',berger:'🐑'};
const PRODUCTEURS = ['fermier','pêcheur','boulanger','berger'];
const DIEUX_PNJ = [{id:'ormund', nom:'Ormund', titre:'le Vieux Dieu des Moissons'},{id:'selune', nom:'Sélune', titre:'la Dame des Eaux Calmes'}];
const BESOINS = {affame:'a faim', malade:'malade', blesse:'blessé·e', menace:'menacé·e', querelle:'en querelle', pauvre:'ruiné·e', deuil:'en deuil'};
const COUT_AIDE = {affame:3, malade:4, blesse:3, menace:5, querelle:3, pauvre:3, deuil:2};

/* ---------- SACRIFICES (actes ponctuels demandés au prophète ou à un croyant) ---------- */
// poids = foi nécessaire pour accepter ; ferveur = gain ; cout = ce que ça coûte au monde
const SACRIFICES = [
  {id:'priere', nom:'Prier à genoux sur la place', poids:10, ferveur:2, desc:'Devant tout le monde. On peut se moquer de lui.'},
  {id:'jeune', nom:'Jeûner trois jours', poids:25, ferveur:5, desc:'Il s\'affaiblit, et peut tomber malade.'},
  {id:'animal', nom:'Offrir un animal', poids:30, ferveur:8, desc:'Une bête de moins pour le village : six vivres.'},
  {id:'marche', nom:'Marcher jusqu\'au hameau voisin', poids:40, ferveur:6, desc:'Il parle de toi à trois inconnus. Il peut se blesser en route.'},
  {id:'recolte', nom:'Offrir toute sa récolte', poids:50, ferveur:15, desc:'Vingt vivres brûlés sur l\'autel. Sa famille risque la faim.'},
  {id:'bete', nom:'Affronter la bête', poids:60, ferveur:25, desc:'Seulement quand une bête rôde. Il peut mourir.'},
  {id:'fils', nom:'Sacrifier son enfant', poids:90, ferveur:60, desc:'Un membre de sa famille meurt. Les siens ne te le pardonneront pas tous. Tu t\'assombris.'}
];
/* ---------- DOGMES (sacrifices réguliers de tous les croyants) ---------- */
const DOGMES = [
  {id:'louange', nom:'Louange quotidienne', poids:15, periode:6, ferveur:1, desc:'Chaque croyant te prie une fois par jour. 1 ferveur par fidèle.'},
  {id:'dime', nom:'Dîme hebdomadaire', poids:30, periode:42, ferveur:5, desc:'Un dixième de ce qu\'ils gagnent. 5 ferveur par fidèle, la richesse du village baisse.'},
  {id:'offrande', nom:'Offrande d\'un animal par semaine', poids:35, periode:42, ferveur:10, desc:'10 ferveur par fidèle. Trois vivres de moins par fidèle.'},
  {id:'jeune', nom:'Jeûne hebdomadaire', poids:40, periode:42, ferveur:6, desc:'6 ferveur par fidèle. Certains tombent malades.'}
];
/* ---------- CONSIGNES (gratuites, limitées par la foi du prophète) ---------- */
const CONSIGNES = [
  {id:'visite', nom:'Va voir une famille', foi:0, desc:'Ils apprennent ton nom ; ceux qui doutent de leur dieu t\'écoutent.'},
  {id:'preche', nom:'Prêche sur la place', foi:30, desc:'Quelques habitants au hasard te découvrent. Ridicule si sa foi est basse.'},
  {id:'console', nom:'Console et soigne', foi:20, desc:'Un geste humain pour un malade ou un endeuillé de ton choix. Pas un miracle, mais ça compte.'},
  {id:'rapport', nom:'Raconte-moi le village', foi:0, desc:'Qui doute, qui souffre, où ça gronde.'}
];
/* ---------- MIRACLES (coût en ferveur, lancés par le prophète) ---------- */
const MIRACLES = [
  {id:'guerison', nom:'Guérison', cout:{famille:7, village:16}, desc:'Les malades et blessés se relèvent. Les témoins te découvrent.'},
  {id:'pluie', nom:'Pluie bienfaisante', cout:{village:8}, desc:'Le grenier se remplit. Trop de pluie peut inonder une famille.'},
  {id:'abondance', nom:'Abondance', cout:{famille:8, village:20}, desc:'Les ruinés se relèvent, la richesse grimpe.'},
  {id:'protection', nom:'Protection', cout:{famille:6, village:14}, desc:'Ni bête, ni querelle, ni bandit pendant deux jours.'},
  {id:'fete', nom:'Fête en ton nom', cout:{village:12}, desc:'Tes fidèles festoient, leur foi monte, les curieux te découvrent. Le grenier se vide un peu.'}
];

let S = null, tab = 'prophete', sheet = null, choixCible = {};

/* ---------- utilitaires ---------- */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a.length ? a[rnd(a.length)] : null;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function save(){localStorage.setItem(SAVE_KEY, JSON.stringify(S))}
function heure(){return (S.tick%TICKS_PAR_JOUR)*4}
function quand(){return `J${S.jour} · ${String(heure()).padStart(2,'0')}h`}
function log(t,imp){S.chronique.unshift({q:quand(), t, imp:!!imp}); if(S.chronique.length>120) S.chronique.length=120}
const nomH = h => `${h.prenom} ${h.famille}`;
const saison = () => SAISONS[Math.floor((S.jour-1)/JOURS_PAR_SAISON)%4];
// messages de la conversation : de = 'p' (prophète) | 'toi' | 'monde' ; choix = [{l:label, a:{type,...}}]
function dire(de, t, choix, imp){
  S.seq=(S.seq||0)+1; S.msgs.push({id:S.seq, q:quand(), de, t, choix:choix||null, imp:!!imp, fait:null});
  if(S.msgs.length>80) S.msgs.splice(0, S.msgs.length-80);
  if(de==='p' && tab!=='prophete') S.nonLus=(S.nonLus||0)+1;
}

/* ---------- création du monde ---------- */
function nouvelHabitant(fam, dieu, prenoms){
  return {id:0, prenom:(prenoms||shuffle([...PRENOMS])).pop(), famille:fam, metier:pick(METIERS),
    dieu, foi:35+rnd(50), besoin:null, besoinDepuis:0, connait:{}, protege:0, prophete:false, disciple:false, triche:0};
}
function nouveauMonde(dieu){
  const habs=[]; const prenoms=shuffle([...PRENOMS]);
  FAMILLES.forEach((fam,fi)=>{ for(let k=0;k<5;k++) habs.push(nouvelHabitant(fam, fi<5?'ormund':'selune', prenoms)); });
  ['fermier','fermier','fermier','pêcheur','boulanger','berger','soigneur','soigneur','soldat','soldat','forgeron','marchand'].forEach((m,i)=>habs[i*3%habs.length].metier=m);
  habs.forEach((h,i)=>h.id=i);
  const p = pick(habs.filter(h=>h.dieu==='ormund'));
  p.dieu='joueur'; p.foi=55; p.prophete=true; p.connait.joueur=true;
  S = {version:VERSION, jour:1, tick:0, derniereMaj:Date.now(), dieu,
    ferveur:3, caractere:0, autel:0, dogmes:[], msgs:[], nonLus:0,
    village:{stock:120, richesse:45, bete:0, conflit:null, conflitJours:0},
    habs, chronique:[], morts:0, derniersRapports:{}, visitesTick:0};
  log(`${nomH(p)}, déçu·e par Ormund, a murmuré ton nom pour la première fois.`, true);
  dire('monde', `Quelque part dans un village de ${habs.length} âmes, ${nomH(p)}, ${p.metier}, déçu·e par Ormund, vient de murmurer ton nom. Personne d'autre ne te connaît.`);
  dire('p', `Es-tu vraiment là ? Je ne sais pas qui tu es, mais Ormund ne m'écoute plus. Si tu existes, dis-moi ce que tu veux de moi. Je ferai ce que je peux.`, null, true);
  dire('monde', `Demande-lui un acte avec le bouton Sacrifice : c'est ainsi que tu gagnes de la ferveur, et c'est la ferveur qui te permet d'agir. Sa foi décide de ce qu'il accepte.`);
  save();
}

/* ---------- lectures ---------- */
const croyants = () => S.habs.filter(h=>h.dieu==='joueur');
const prophete = () => S.habs.find(h=>h.prophete);
const disciples = () => S.habs.filter(h=>h.disciple);
const renommee = () => Math.round(100*S.habs.filter(h=>h.connait.joueur).length/S.habs.length);
const prod = () => S.habs.filter(h=>PRODUCTEURS.includes(h.metier) && !h.besoin).length*3*saison().k;
const conso = () => S.habs.length*1.0;
const jauges = () => { const v=S.village, n=S.habs.length; return {
    nourriture: clamp(Math.round(100*(v.stock/n)/5),0,100),
    securite: Math.round(100*S.habs.filter(h=>!['menace','querelle'].includes(h.besoin)).length/n),
    sante: Math.round(100*S.habs.filter(h=>!['malade','blesse'].includes(h.besoin)).length/n),
    richesse: clamp(Math.round(v.richesse),0,100) }; };
const nomDieu = id => id==='joueur'? S.dieu.nom : DIEUX_PNJ.find(d=>d.id===id).nom;
const attr = (k,v) => S.dieu[k]===v;
const maxDogmes = () => { const p=prophete(); if(!p) return 0; return (p.foi<40?1:p.foi<70?2:3) + disciples().length; };
const suitDogme = (h,d) => h.dieu==='joueur' && h.foi>=d.poids;

/* ---------- le prophète parle (chaque tranche) ---------- */
function rapportProphete(force){
  const p=prophete(); if(!p) return;
  let n=0; const max = force?9:2;
  const dit = (t,choix,imp)=>{ if(n<max){ dire('p',t,choix,imp); n++; } };
  // 1. sa propre souffrance
  if(p.besoin && !S.derniersRapports['moi'+p.besoin]){
    S.derniersRapports['moi'+p.besoin]=S.tick;
    const t={affame:'Je n\'ai rien mangé depuis deux jours. Je tiendrai, mais pas longtemps.',malade:'La fièvre me tient. Si tu veux encore d\'un prophète, aide-moi.',blesse:'Je saigne. Je ne peux plus marcher pour toi.',menace:'La bête a tourné autour de ma maison cette nuit.',querelle:'Ma famille est prise dans la querelle. On me regarde de travers.',pauvre:'Je n\'ai plus rien. J\'ai tout donné.',deuil:'Nous avons enterré quelqu\'un des miens. Pourquoi ?'}[p.besoin];
    dit(t, [{l:`Aider · ${COUT_AIDE[p.besoin]} ferveur`, a:{type:'aiderPersonne', id:p.id}},{l:'Tiens bon', a:{type:'rien', foi:-6, id:p.id}}], true);
  }
  // 2. familles qui souffrent (groupées)
  if(!force || true){
    const parFam={};
    S.habs.filter(h=>h.besoin&&!h.prophete).forEach(h=>{ (parFam[h.famille]=parFam[h.famille]||[]).push(h); });
    const fams=Object.entries(parFam).sort((a,b)=>b[1].length-a[1].length);
    for(const [fam,hs] of fams){
      const cle='fam'+fam; if(!force && S.derniersRapports[cle] && S.tick-S.derniersRapports[cle]<4) continue;
      const fid=hs.filter(h=>h.dieu==='joueur').length;
      const cout=hs.reduce((a,h)=>a+COUT_AIDE[h.besoin],0);
      const resume=hs.slice(0,3).map(h=>`${h.prenom} ${BESOINS[h.besoin]}`).join(', ')+(hs.length>3?` et ${hs.length-3} autre(s)`:'');
      S.derniersRapports[cle]=S.tick;
      dit(`Chez les ${fam}, ${resume}. ${fid?`${fid} d'entre eux te ${fid>1?'suivent':'suit'}.`:'Aucun ne te connaît encore.'} Tu veux les aider ?`,
        [{l:`Aider · ${cout} ferveur`, a:{type:'aiderFamille', fam}},{l:'Pas maintenant', a:{type:'rien'}}]);
      if(n>=max) break;
    }
  }
  // 3. douteurs qui te connaissent
  const douteurs=S.habs.filter(h=>h.dieu!=='joueur'&&h.foi<30&&h.connait.joueur);
  if(douteurs.length && (force || !S.derniersRapports.dout || S.tick-S.derniersRapports.dout>=5)){
    S.derniersRapports.dout=S.tick;
    const d=pick(douteurs);
    dit(`${nomH(d)} ne croit plus en ${nomDieu(d.dieu)}. ${douteurs.length>1?`Il y en a ${douteurs.length} comme ça qui ont entendu ton nom.`:''} Je peux aller lui parler.`,
      [{l:'Va le voir', a:{type:'visitePersonne', id:d.id}},{l:'Laisse', a:{type:'rien'}}]);
  }
  // 4. disciple possible
  if(croyants().length>=8 && p.foi>=70 && disciples().length<3 && (force || !S.derniersRapports.disc || S.tick-S.derniersRapports.disc>=12)){
    const cand=pick(croyants().filter(h=>!h.prophete&&!h.disciple&&h.foi>=60));
    if(cand){ S.derniersRapports.disc=S.tick; dit(`Nous sommes assez nombreux pour que je ne puisse plus tout faire seul. ${nomH(cand)} est de ceux qui ne reculent pas. Veux-tu que j'en fasse mon disciple ?`,[{l:'Nomme-le', a:{type:'disciple', id:cand.id}},{l:'Pas encore', a:{type:'rien'}}], true); }
  }
  // 5. le village, en bref (si forcé)
  if(force){ const j=jauges(); const v=S.village;
    dit(`Le grenier ${j.nourriture<30?'est presque vide':j.nourriture<60?'se vide':'est plein'} (${Math.round(v.stock)} vivres, ${saison().n.toLowerCase()}). ${v.bete>0?'Une bête rôde. ':''}${v.conflit?`Les ${v.conflit[0]} et les ${v.conflit[1]} se querellent. `:''}${S.habs.filter(h=>['malade','blesse'].includes(h.besoin)).length} souffrent dans leur corps. ${croyants().length} te suivent, ${renommee()}% du village connaît ton nom.`);
    if(S.dogmes.length) dit('Tes dogmes : '+S.dogmes.map(id=>{const d=DOGMES.find(x=>x.id===id); const s=croyants().filter(h=>suitDogme(h,d)).length; return `${d.nom.toLowerCase()} (${s}/${croyants().length} le suivent)`;}).join(' ; ')+'.');

/* ---------- une tranche de 4 heures ---------- */
function moment(){
  const v=S.village, n=S.habs.length, p=prophete();
  const libres = ()=>S.habs.filter(h=>!h.besoin&&h.protege<=0);
  const evts = [];
  S.visitesTick=0;
  // contagion, maladies, blessures, faim, ruine, bandits, querelles, bête
  S.habs.filter(h=>h.besoin==='malade').forEach(m=>{ S.habs.filter(h=>h.famille===m.famille&&!h.besoin&&h.protege<=0).forEach(h=>{ if(Math.random()<0.04){h.besoin='malade';h.besoinDepuis=0;} }); });
  const pMal = 0.008 + (saison().n==='Hiver'?0.008:0) + (v.stock<n?0.01:0);
  libres().forEach(h=>{ if(Math.random()<pMal){h.besoin='malade';h.besoinDepuis=0;} });
  libres().filter(h=>['forgeron','bûcheron','fermier','soldat'].includes(h.metier)).forEach(h=>{ if(Math.random()<0.012){h.besoin='blesse';h.besoinDepuis=0;} });
  if(v.stock<=0){ shuffle(libres()).slice(0,2).forEach(h=>{h.besoin='affame';h.besoinDepuis=0;}); }
  if(v.richesse<30 && Math.random()<0.25){ const h=pick(libres()); if(h){h.besoin='pauvre';h.besoinDepuis=0;} }
  if(Math.random()<0.03){ v.richesse-=6; const h=pick(libres()); if(h){h.besoin='pauvre';h.besoinDepuis=0; evts.push(`Des bandits ont dévalisé ${nomH(h)} sur la route.`);} }
  if(!v.conflit && Math.random()<0.03){ const a=pick(FAMILLES), b=pick(FAMILLES.filter(f=>f!==a)); v.conflit=[a,b]; v.conflitJours=2; evts.push(`Les ${a} et les ${b} se sont disputé un pré. Ça gronde.`); }
  if(v.conflit){ shuffle(S.habs.filter(h=>v.conflit.includes(h.famille)&&!h.besoin&&h.protege<=0)).slice(0,2).forEach(h=>{h.besoin='querelle';h.besoinDepuis=0;}); if(Math.random()<0.04){ const h=pick(S.habs.filter(x=>x.besoin==='querelle')); if(h){h.besoin='blesse'; evts.push(`La querelle a tourné aux coups : ${nomH(h)} est blessé·e.`);} } }
  if(v.bete<=0 && Math.random()<0.025){ v.bete=3+rnd(4); evts.push('Des traces inconnues près de la rivière. Une bête est arrivée.'); }
  if(v.bete>0){ shuffle(libres()).slice(0,3).forEach(h=>{h.besoin='menace';h.besoinDepuis=0;}); const soldats=S.habs.filter(h=>h.metier==='soldat'&&!h.besoin).length; v.bete -= 0.15+soldats*0.12; if(Math.random()<0.03){ const vict=pick(S.habs.filter(h=>h.besoin==='menace')); if(vict) mort(vict,'emporté·e par la bête'); } if(v.bete<=0){ evts.push('La bête a été chassée. Le village respire.'); S.habs.forEach(h=>{if(h.besoin==='menace')h.besoin=null;}); } }
  // soins et guérisons naturelles
  const soins=S.habs.filter(h=>h.metier==='soigneur'&&!h.besoin).length;
  S.habs.filter(h=>['malade','blesse'].includes(h.besoin)&&h.besoinDepuis>=3).slice(0,soins).forEach(h=>h.besoin=null);
  S.habs.filter(h=>h.besoin==='pauvre'&&h.besoinDepuis>=9&&Math.random()<0.2).forEach(h=>h.besoin=null);
  S.habs.filter(h=>h.besoin==='deuil'&&h.besoinDepuis>=6).forEach(h=>h.besoin=null);
  // besoins qui durent : la foi s'use, et parfois on meurt
  S.habs.forEach(h=>{
    if(h.besoin){ h.besoinDepuis++; h.foi=clamp(h.foi-1,0,100);
      if(h.besoin==='affame'&&h.besoinDepuis>18&&Math.random()<0.04) mort(h,'mort·e de faim');
      if(h.besoin==='malade'&&h.besoinDepuis>15&&Math.random()<0.03) mort(h,'emporté·e par la fièvre'); }
    if(h.protege>0) h.protege--;
  });
  // DOGMES : échéances, ferveur, coût au monde, tricheurs
  S.dogmes.forEach(id=>{
    const d=DOGMES.find(x=>x.id===id); if(S.tick%d.periode!==0) return;
    const fid=croyants().filter(h=>suitDogme(h,d)); const tri=croyants().filter(h=>!suitDogme(h,d));
    S.ferveur+=fid.length*d.ferveur;
    if(id==='dime') v.richesse-=fid.length*0.8;
    if(id==='offrande') v.stock-=fid.length*3;
    if(id==='jeune') fid.forEach(h=>{ if(!h.besoin&&Math.random()<0.12){h.besoin='malade';h.besoinDepuis=0;} });
    tri.forEach(h=>{ h.triche++; h.foi=clamp(h.foi-2,0,100); });
    if(fid.length) evts.push(`${d.nom} : ${fid.length} fidèles, +${fid.length*d.ferveur} ferveur${tri.length?` (${tri.length} ont fait semblant)`:''}.`);
  });
  // la foi des croyants s'érode doucement sans actes ; les dogmes suivis l'entretiennent
  croyants().forEach(h=>{ if(S.tick%TICKS_PAR_JOUR===0){ const suit=S.dogmes.some(id=>suitDogme(h,DOGMES.find(x=>x.id===id))); h.foi=clamp(h.foi+(suit?1:-1),0,100); } });
  // les disciples et le prophète font connaître ; les douteurs connus s'approchent
  disciples().forEach(dp=>{ if(Math.random()<0.3){ const h=pick(S.habs.filter(x=>!x.connait.joueur)); if(h)h.connait.joueur=true; } const d=pick(S.habs.filter(h=>h.famille===dp.famille&&h.dieu!=='joueur'&&h.foi<30)); if(d&&Math.random()<0.04) convertir(d); });
  if(p && p.foi>50){ const d=pick(S.habs.filter(h=>h.dieu!=='joueur'&&h.foi<30&&h.connait.joueur)); if(d&&Math.random()<0.03) convertir(d); }
  for(let i=0;i<S.autel;i++){ if(S.tick%TICKS_PAR_JOUR===0){ const h=pick(S.habs.filter(h=>!h.connait.joueur)); if(h)h.connait.joueur=true; } }
  // les dieux PNJ : réponses à leurs fidèles, reconquête de tes douteurs
  DIEUX_PNJ.forEach(d=>{
    const fid=S.habs.filter(h=>h.dieu===d.id); const pr=clamp(0.75 - fid.length/40, 0.12, 0.75);
    fid.forEach(h=>{ const prie = h.besoin ? (h.besoinDepuis>=2 && Math.random()<0.5 ? h.besoin : null) : (Math.random()<0.08 ? 'petite' : null); if(!prie) return;
      if(Math.random()<pr*0.9){ if(prie!=='petite'){ if(prie==='affame')v.stock+=5; h.besoin=null; } h.foi=clamp(h.foi+10,0,100); } else h.foi=clamp(h.foi-(prie==='petite'?3:5),0,100); });
    croyants().filter(h=>h.foi<30&&!h.prophete).forEach(h=>{ if(Math.random()<0.04){ h.dieu=d.id; h.foi=45; h.disciple=false; log(`${nomH(h)} est retourné·e vers ${d.nom}.`); dire('monde',`${nomH(h)} est retourné·e vers ${d.nom}.`); } });
  });
  S.habs.filter(h=>h.dieu!=='joueur'&&h.foi<22&&Math.random()<0.03).forEach(h=>{ const autre=DIEUX_PNJ.find(d=>d.id!==h.dieu); h.dieu=autre.id; h.foi=45; });
  evts.forEach(e=>{ log(e); dire('monde', e); });
  rapportProphete(false);
}
function finDeJournee(){
  const v=S.village;
  v.stock = v.stock*0.97 + prod() - conso(); if(v.stock<0) v.stock=0;
  v.richesse += (prod()-conso())/8 + S.habs.filter(h=>h.metier==='marchand'&&!h.besoin).length*0.6 - 2.5; v.richesse=clamp(v.richesse,0,100);
  if(v.conflit){ v.conflitJours--; if(v.conflitJours<=0){ log(`Les ${v.conflit[0]} et les ${v.conflit[1]} ont enterré la hache.`); v.conflit=null; S.habs.forEach(h=>{if(h.besoin==='querelle')h.besoin=null;}); } }
  if(S.caractere<0) S.caractere+=0.15;
  S.sacJour=0;
  if(croyants().length===0){ const d=pick(S.habs.filter(h=>h.foi<30&&h.connait.joueur)); if(d&&Math.random()<0.4){d.dieu='joueur';d.foi=50;d.prophete=true;log(`${nomH(d)}, déçu·e, s'est souvenu·e de toi.`, true); dire('p',`Je suis ${nomH(d)}. On m'a parlé de toi. Mon dieu ne répond plus. Que veux-tu de moi ?`,null,true);} else if(!S.habs.some(h=>h.connait.joueur)){ pick(S.habs).connait.joueur=true; } }
  const sNew=saison(); if((S.jour-1)%JOURS_PAR_SAISON===0) dire('monde', `${sNew.e} ${sNew.n}. ${sNew.n==='Hiver'?'Les champs dorment, les réserves fondent.':sNew.n==='Été'?'Les récoltes sont belles.':''}`);
  log(`Jour ${S.jour} — ${croyants().length} croyant·s, ${S.ferveur} ferveur.`);
}
function mort(h, cause){
  log(`${nomH(h)} est ${cause}.`, true); dire('monde', `${nomH(h)} est ${cause}.`, null, true); S.morts++;
  const i=S.habs.indexOf(h); S.habs.splice(i,1); S.habs.forEach((x,k)=>x.id=k);
  S.habs.filter(x=>x.famille===h.famille&&!x.besoin).slice(0,2).forEach(x=>{x.besoin='deuil';x.besoinDepuis=0;});
  if(h.prophete){ const c=pick(croyants().sort((a,b)=>b.foi-a.foi).slice(0,3)); if(c){c.prophete=true; c.disciple=false; dire('p',`Je suis ${nomH(c)}. ${h.prenom} n'est plus. Je reprends sa parole, si tu veux de moi.`,null,true); log(`${nomH(c)} reprend la parole du prophète.`);} }
  const nb=nouvelHabitant(pick(FAMILLES), pick(['ormund','selune'])); nb.id=S.habs.length; nb.foi=50; S.habs.push(nb);
}
function avancer(){ S.tick++; moment(); if(S.tick%TICKS_PAR_JOUR===0){ S.jour++; finDeJournee(); } }
function rattraper(){
  let ticks=Math.floor((Date.now()-S.derniereMaj)/TICK_MS); if(ticks<=0) return 0;
  const n=Math.min(ticks, 6*TICKS_PAR_JOUR*5);
  for(let i=0;i<n;i++) avancer();
  S.derniereMaj += ticks*TICK_MS; save(); return n;
}

/* ---------- rendu ---------- */
const app=document.getElementById('app');
function render(){
  if(!S) return renderSetup();
  const p=prophete(), c=croyants().length;
  if(tab==='prophete') S.nonLus=0;
  app.innerHTML=`
  <header>
    <h1><span>${S.dieu.nom}</span><small>${quand()} · ${saison().e} · v${VERSION}</small></h1>
    <div class="stats">
      <div class="stat gold"><b>${S.ferveur}</b>ferveur</div>
      <div class="stat"><b>${c}</b>croyants</div>
      <div class="stat"><b>${renommee()}%</b>connu</div>
      <div class="stat pro"><b>${p?p.foi:'—'}</b>foi du prophète</div>
    </div>
  </header>
  <main>
    <div class="tab ${tab==='prophete'?'on':''}" id="conv">${renderConv()}</div>
    <div class="tab ${tab==='village'?'on':''}">${renderVillage()}</div>
    <div class="tab ${tab==='chronique'?'on':''}">${renderChronique()}</div>
  </main>
  ${tab==='prophete'&&p?`<div class="parole">
    <button class="${sheet==='sacrifice'?'on':''}" onclick="ouvrir('sacrifice')">🔥 Sacrifice</button>
    <button class="${sheet==='dogme'?'on':''}" onclick="ouvrir('dogme')">📜 Dogme</button>
    <button class="${sheet==='consigne'?'on':''}" onclick="ouvrir('consigne')">🗣️ Consigne</button>
    <button class="${sheet==='miracle'?'on':''}" onclick="ouvrir('miracle')">✨ Miracle</button>
  </div>${sheet?renderSheet():''}`:''}
  <nav>
    <button class="${tab==='prophete'?'on':''}" onclick="go('prophete')"><span>✦</span>Prophète${S.nonLus?`<i>${S.nonLus}</i>`:''}</button>
    <button class="${tab==='village'?'on':''}" onclick="go('village')"><span>🏘️</span>Village</button>
    <button class="${tab==='chronique'?'on':''}" onclick="go('chronique')"><span>📖</span>Chronique</button>
  </nav>`;
  if(tab==='prophete'){ const el=document.getElementById('conv'); if(el && !sheet) window.scrollTo(0, document.body.scrollHeight); }
}
function go(t){tab=t;sheet=null;render();if(t!=='prophete')window.scrollTo(0,0)}
function renderConv(){
  const p=prophete();
  let s=S.msgs.map(m=>`<div class="msg ${m.de} ${m.imp?'imp':''}">${m.de==='p'?`<small class="q">${p?p.prenom:'Le prophète'} · ${m.q}</small>`:''}<div class="b">${m.t}${m.choix&&m.fait===null?`<div class="ch">${m.choix.map((c,i)=>`<button class="${i?'sec':''}" onclick="agir(${m.id},${i})">${c.l}</button>`).join('')}</div>`:''}${m.fait?`<div class="done">${m.fait}</div>`:''}</div></div>`).join('');
  if(!p) s+=`<div class="msg monde"><div class="b">Tu n'as plus de prophète. Attends qu'un déçu se souvienne de toi.</div></div>`;
  const prochain = 10 - Math.floor(((Date.now()-S.derniereMaj)%TICK_MS)/60000);
  s+=`<div class="msg monde"><div class="b">Prochaine tranche dans ${prochain} min.</div></div>`;
  return s;
}
function renderSheet(){
  const p=prophete(); let s='';
  if(sheet==='sacrifice'){
    s=`<h3>Demande un sacrifice <span>sa foi : ${p.foi}</span></h3>`+SACRIFICES.map(sa=>{const ok=p.foi+10>=sa.poids; return `<div class="opt ${ok?'':'lock'}"><div><b>${sa.nom}</b><small>${sa.desc} · foi ${sa.poids} · +${sa.ferveur} ferveur</small></div><button ${sa.id==='bete'&&S.village.bete<=0?'disabled':''} onclick="demanderSacrifice('${sa.id}')">${ok?'Demande':'Risqué'}</button></div>`;}).join('');
  }
  if(sheet==='dogme'){
    s=`<h3>Les dogmes <span>${S.dogmes.length}/${maxDogmes()} actifs</span></h3>`+DOGMES.map(d=>{const on=S.dogmes.includes(d.id); const n=croyants().filter(h=>suitDogme(h,d)).length; return `<div class="opt"><div><b>${d.nom}${on?' ✓':''}</b><small>${d.desc} · foi ${d.poids} · ${n}/${croyants().length} le suivraient</small></div><button onclick="toggleDogme('${d.id}')">${on?'Abolir':'Instaurer'}</button></div>`;}).join('');
  }
  if(sheet==='consigne'){
    s=`<h3>Donne une consigne <span>gratuit · ${S.visitesTick?'déjà fait cette tranche':'une par tranche'}</span></h3>`+CONSIGNES.map(c=>{const ok=p.foi>=c.foi; let ctrl='';
      if(c.id==='visite') ctrl=`<select class="sel" id="c-visite">${FAMILLES.map(f=>`<option value="${f}">Les ${f} (${S.habs.filter(h=>h.famille===f&&h.dieu==='joueur').length}/${S.habs.filter(h=>h.famille===f).length} te suivent, ${S.habs.filter(h=>h.famille===f&&h.dieu!=='joueur'&&h.foi<30).length} doutent)</option>`).join('')}</select>`;
      if(c.id==='console'){ const hs=S.habs.filter(h=>h.besoin&&!h.prophete); ctrl=hs.length?`<select class="sel" id="c-console">${hs.map(h=>`<option value="${h.id}">${nomH(h)} · ${BESOINS[h.besoin]} (${nomDieu(h.dieu)})</option>`).join('')}</select>`:'<small style="color:var(--quiet)">Personne ne souffre en ce moment.</small>'; }
      return `<div class="opt ${ok?'':'lock'}"><div><b>${c.nom}</b><small>${c.desc}${c.foi?` · foi ${c.foi}`:''}</small>${ctrl}</div><button ${ok?'':'disabled'} onclick="consigneUI('${c.id}')">Va</button></div>`;}).join('');
  }
  if(sheet==='miracle'){
    s=`<h3>Un miracle par ses mains <span>${S.ferveur} ferveur</span></h3>`+MIRACLES.map(m=>{const cibles=Object.keys(m.cout); const cb=choixCible[m.id]||cibles[0]; let ctrl='';
      if(cibles.length>1) ctrl=`<div style="display:flex;gap:6px;margin-top:6px">${cibles.map(c=>`<button style="background:${c===cb?'var(--gold)':'#33363f'};color:${c===cb?'#1a1200':'var(--ink)'};font-weight:400;padding:5px 10px;font-size:13px" onclick="choixCible['${m.id}']='${c}';render()">${c} · ${m.cout[c]}</button>`).join('')}</div>`;
      if(cb==='famille') ctrl+=`<select class="sel" id="m-${m.id}">${FAMILLES.map(f=>`<option value="${f}">Les ${f} (${S.habs.filter(h=>h.famille===f&&h.besoin).length} en difficulté)</option>`).join('')}</select>`;
      return `<div class="opt"><div><b>${m.nom}</b><small>${m.desc}</small>${ctrl}</div><button ${S.ferveur<m.cout[cb]?'disabled':''} onclick="miracleUI('${m.id}','${cb}')">${m.cout[cb]}</button></div>`;}).join('');
  }
  return `<div class="sheet">${s}</div>`;
}
function consigneUI(id){ const sel=document.getElementById('c-'+id); consigne(id, sel?sel.value:null); }
function miracleUI(id,cb){ const sel=document.getElementById('m-'+id); miracle(id, cb, sel?sel.value:null); }

function barre(nom,val,aide){const cls=val<30?'bad':val<60?'warn':'';return `<div class="gauge"><div class="lbl"><span>${nom}</span><span>${val}%</span></div><div class="bar"><i class="${cls}" style="width:${val}%"></i></div><small style="color:var(--quiet);font-size:12px">${aide}</small></div>`}
function renderVillage(){
  const j=jauges(), v=S.village, sa=saison();
  let s=`<h2>Le village</h2>
  ${barre('Nourriture',j.nourriture,`${Math.round(v.stock)} vivres · récolte ${Math.round(prod())} / jour (${sa.e} ${sa.n}), on mange ${Math.round(conso())} / jour`)}
  ${barre('Sécurité',j.securite,v.bete>0?'Une bête rôde autour du village.':v.conflit?`Les ${v.conflit[0]} et les ${v.conflit[1]} se querellent.`:'Rien ne menace le village.')}
  ${barre('Santé',j.sante,`${S.habs.filter(h=>['malade','blesse'].includes(h.besoin)).length} malade(s) ou blessé(s)`)}
  ${barre('Richesse',j.richesse,'Ce que le village produit en plus de ses besoins.')}
  <h2>Les dieux</h2>`;
  ['joueur',...DIEUX_PNJ.map(d=>d.id)].forEach(id=>{const n=S.habs.filter(h=>h.dieu===id).length; s+=`<div class="row"><span>${nomDieu(id)}${id==='joueur'?' (toi)':''}<small>${id==='joueur'?[ELEMENTS[S.dieu.element],VALEURS[S.dieu.valeur],MANIERES[S.dieu.maniere]].join(' · ')+' · '+(S.caractere<-1?'sombre':'lumineux'):DIEUX_PNJ.find(d=>d.id===id).titre}</small></span><b>${n}</b></div>`});
  s+=`<p style="font-size:13px;color:var(--quiet)">${S.dogmes.length?'Dogmes : '+S.dogmes.map(id=>DOGMES.find(x=>x.id===id).nom.toLowerCase()).join(', ')+'.':'Aucun dogme.'} ${disciples().length?disciples().length+' disciple(s).':''}</p><h2>Les familles</h2>`;
  FAMILLES.forEach(f=>{
    const membres=S.habs.filter(h=>h.famille===f); const nb=membres.filter(h=>h.dieu==='joueur').length;
    s+=`<div class="famille"><h3>Les ${f} <small>${nb}/${membres.length} te suivent</small></h3>`;
    membres.sort((a,b)=>(b.dieu==='joueur')-(a.dieu==='joueur')).forEach(h=>{ const et=h.besoin?BESOINS[h.besoin]:'';
      s+=`<div class="row"><span>${EMOJI[h.metier]} ${h.prenom}${h.prophete?' ✦':h.disciple?' ✧':''}<small>${h.metier}${et?' · '+et:''}${h.connait.joueur?'':' · ne te connaît pas'}</small></span><span class="foi ${h.dieu==='joueur'?'me':h.foi<30?'doubt':''}">${nomDieu(h.dieu)} ${h.foi}</span></div>`});
    s+='</div>';
  });
  return s;
}
function renderChronique(){
  let s='<h2>Chronique</h2>'+S.chronique.map(l=>`<div class="log ${l.imp?'imp':''}"><small>${l.q}</small>${l.t}</div>`).join('');
  s+=`<div class="test">Outils de test — une tranche = 10 minutes réelles, 6 tranches = 1 jour.<br>
  <button onclick="testAv(1)">+1 tranche</button><button onclick="testAv(6)">+1 jour</button><button onclick="testAv(42)">+7 jours</button><button onclick="S.ferveur+=20;save();render()">+20 ferveur</button><button onclick="if(confirm('Tout effacer et recommencer ?')){localStorage.removeItem(SAVE_KEY);S=null;render()}">Recommencer</button></div>`;
  return s;
}
function testAv(n){for(let i=0;i<n;i++)avancer(); save(); render();}
function renderSetup(){
  const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  app.innerHTML=`<div class="setup">
    <h1 style="margin:0 0 4px">Le jeu du dieu</h1>
    <p style="color:var(--quiet);font-size:14px">Tu ne verras le monde que par les yeux d'un seul homme : ton prophète. Ce qu'il accepte de faire pour toi décide de tout.</p>
    <label>Ton nom</label><input id="nom" placeholder="Ilyra, Vorn, Aëlis…" maxlength="18">
    <label>Ton élément</label><select id="element">${opts(ELEMENTS)}</select>
    <label>Ta valeur</label><select id="valeur">${opts(VALEURS)}</select>
    <label>Ta manière</label><select id="maniere">${opts(MANIERES)}</select>
    <button class="go" onclick="demarrer()">Naître</button>
    <p style="color:var(--quiet);font-size:12px;margin-top:20px">Prototype v${VERSION}. Le monde avance toutes les dix minutes, même quand tu n'es pas là.</p>
  </div>`;
}
function demarrer(){ const nom=document.getElementById('nom').value.trim()||'Sans-Nom'; nouveauMonde({nom, element:element.value, valeur:valeur.value, maniere:maniere.value}); tab='prophete'; render(); }

/* ---------- démarrage ---------- */
(function(){
  try{ const s=localStorage.getItem(SAVE_KEY); if(s){ S=JSON.parse(s); if(S.version!==VERSION) S=null; } }catch(e){ S=null; }
  if(S){ const n=rattraper(); if(n) setTimeout(()=>toast(`${n} tranche(s) ont passé pendant ton absence.`),300); }
  render();
  setInterval(()=>{ if(S && rattraper()) render(); }, 30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S && rattraper()) render(); });
})();
</script>
</body>
</html>

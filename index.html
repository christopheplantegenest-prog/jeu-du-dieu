<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jeu du dieu</title>
<style>
:root{--bg:#14161c;--card:#1e2129;--line:#2d313c;--ink:#ecebe4;--quiet:#9a9c9a;--gold:#e0b45c;--good:#6fbf73;--bad:#d96b5c;--blue:#6ca0d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:70px}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
header h1 small{font-size:11px;color:var(--quiet);font-weight:400}
.stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;flex:1;text-align:center;min-width:70px}
.stat b{display:block;font-size:17px}
.stat.gold b{color:var(--gold)}
main{padding:14px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--quiet);padding:10px 2px 8px;font-size:12px}
nav button.on{color:var(--gold)}
nav button span{display:block;font-size:20px}
nav button i{position:absolute;margin-left:4px;margin-top:-4px;background:var(--bad);color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;position:relative;transition:transform .25s,opacity .25s}
.card.out-r{transform:translateX(120%) rotate(8deg);opacity:0}
.card.out-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.face{width:44px;height:44px;border-radius:50%;background:#2b3040;display:flex;align-items:center;justify-content:center;font-size:24px}
.who b{display:block}.who small{color:var(--quiet);font-size:12px}
.tagc{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#2b3040;color:var(--quiet);margin-left:6px}
.tagc.conv{background:#3d3250;color:#d8b8ff}
.prayer{font-size:17px;font-style:italic;margin:6px 0 14px}
.btns{display:flex;gap:10px}
.btns button{flex:1;padding:12px;border-radius:10px;border:0;font-size:15px;font-weight:600}
.yes{background:var(--gold);color:#1a1200}.no{background:#33363f;color:var(--ink)}
.yes:disabled{opacity:.4}
.cost{font-size:12px;color:var(--quiet);text-align:center;margin-top:8px}
.empty{color:var(--quiet);text-align:center;padding:30px 10px}
h2{font-size:15px;color:var(--quiet);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
h2:first-child{margin-top:0}
.gauge{margin-bottom:10px}
.gauge div.lbl{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;background:#2b3040;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.warn{background:var(--gold)}.bar i.bad{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row small{color:var(--quiet);display:block;font-size:12px}
.foi{font-size:12px;padding:2px 7px;border-radius:9px;background:#2b3040}
.foi.me{background:#4a3d1a;color:var(--gold)}
.foi.doubt{background:#4a2a2a;color:#f0a0a0}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.act b{display:block}.act small{color:var(--quiet);font-size:12px}
.act button{background:var(--gold);color:#1a1200;border:0;border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap}
.act button:disabled{background:#33363f;color:var(--quiet)}
.log{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.log small{color:var(--quiet);margin-right:6px}
.setup{padding:20px 16px}
.setup label{display:block;margin:14px 0 6px;color:var(--quiet);font-size:13px}
.setup input,.setup select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.setup .go{margin-top:24px;width:100%;padding:14px;background:var(--gold);border:0;border-radius:10px;font-size:17px;font-weight:600}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#2b3040;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
.toast.on{opacity:1}
.test{margin-top:24px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--quiet)}
.test button{background:#33363f;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;margin:4px 4px 0 0}
.sel{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   LE JEU DU DIEU — prototype v1 (hors ligne, un seul fichier)
   Un jour de jeu = DAY_MS de temps réel. Tout est simulé.
   ============================================================ */
const VERSION = 1;
const DAY_MS = 60*60*1000;          // 1 jour de jeu = 1 heure réelle
const SAVE_KEY = 'jeu-du-dieu-v1';

const ELEMENTS = {eau:'Eau', feu:'Feu', terre:'Terre', vent:'Vent', lumiere:'Lumière', ombre:'Ombre'};
const VALEURS  = {justice:'Justice', liberte:'Liberté', partage:'Partage', ambition:'Ambition', ordre:'Ordre', chaos:'Chaos'};
const MANIERES = {doux:'Doux', brutal:'Brutal', visible:'Visible', discret:'Discret'};
const COMMANDEMENTS = {justice:'Rends à chacun ce qui lui est dû.', liberte:'Que nul ne soit enchaîné.', partage:'Partage ta récolte avec ton voisin.', ambition:'Ne te contente jamais de ce que tu as.', ordre:'Respecte ta place et celle des autres.', chaos:'Ne suis aucune règle que la tienne.'};

const PRENOMS = ['Marthe','Odile','Gaspard','Léon','Brune','Thibault','Aurèle','Mahaut','Colin','Sidonie','Baptiste','Rosalie','Anselme','Iris','Firmin','Jeanne','Ambroise','Lison','Barnabé','Hortense','Côme','Perrine','Eloi','Flavie'];
const FAMILLES = ['Vauclair','Moreau','Dufresne','Lambert','Roussel','Garnier'];
const METIERS  = ['fermier','pêcheur','boulanger','forgeron','soigneur','soldat','marchand','tisserand'];
const EMOJI = {fermier:'🌾',pêcheur:'🎣',boulanger:'🍞',forgeron:'⚒️',soigneur:'🌿',soldat:'🛡️',marchand:'⚖️',tisserand:'🧵'};

// Dieux PNJ déjà établis
const DIEUX_PNJ = [
  {id:'ormund', nom:'Ormund', titre:'le Vieux Dieu des Moissons'},
  {id:'selune', nom:'Sélune', titre:'la Dame des Eaux Calmes'}
];

// Besoins : coût pour exaucer, texte des prières
const BESOINS = {
  affame : {cout:3, foi:25, txt:['Mes enfants ont faim, le grenier est vide.','Trois jours sans pain. Entends-moi.','La soupe est claire comme l\'eau, aide-nous.']},
  malade : {cout:4, foi:30, txt:['La fièvre ne me lâche plus, guéris-moi.','Je tousse du sang depuis l\'aube.','Mon fils brûle de fièvre, sauve-le.']},
  menace : {cout:6, foi:30, txt:['La bête rôde près de ma ferme, protège-nous.','On a entendu hurler dans la nuit. J\'ai peur.','Mes bêtes ont été égorgées. Qui sera le prochain ?']},
  pauvre : {cout:3, foi:20, txt:['Je n\'ai plus de quoi acheter de graines.','Les dettes m\'étranglent, donne-moi un signe.','Mon échoppe est vide, personne n\'achète plus.']},
  petite : {cout:1, foi:12, txt:['Mon toit fuit, fais-moi une nuit sans pluie.','Ma fille se marie demain, bénis-la.','Mon four est éteint depuis trois jours.','J\'ai perdu ma bague de mariage, aide-moi à la retrouver.','Donne-moi le courage de parler à mon voisin.','Fais que mon pain lève bien demain.']}
};

let S = null;   // état du jeu
let tab = 'prieres';

/* ---------- utilitaires ---------- */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function save(){localStorage.setItem(SAVE_KEY, JSON.stringify(S))}
function log(t){S.chronique.unshift({j:S.jour, t}); if(S.chronique.length>80) S.chronique.length=80}

/* ---------- création du monde ---------- */
function nouveauMonde(dieu){
  const habs=[]; const prenoms=shuffle([...PRENOMS]);
  FAMILLES.forEach((fam,fi)=>{
    for(let k=0;k<4;k++){
      habs.push({id:habs.length, prenom:prenoms.pop(), famille:fam, metier:pick(METIERS),
        dieu: fi<4?'ormund':'selune', foi:40+rnd(45), besoin:null, besoinDepuis:0,
        connait:{}, priePas:0});
    }
  });
  // Au moins un fermier, un soigneur, un soldat
  habs[0].metier='fermier'; habs[1].metier='soigneur'; habs[2].metier='soldat'; habs[3].metier='fermier'; habs[4].metier='pêcheur'; habs[5].metier='boulanger';
  // Le premier croyant : un douteur déçu
  const d = pick(habs.filter(h=>h.dieu==='ormund'));
  d.dieu='joueur'; d.foi=55; d.connait.joueur=true;
  habs.filter(h=>h.famille===d.famille).forEach(h=>h.connait.joueur=true);

  S = {version:VERSION, jour:1, derniereMaj:Date.now(), dieu,
    pouvoir:5, caractere:0, oeuvres:{autel:0,temple:0,prophete:0},
    village:{stock:50, richesse:40, bete:0, pop:habs.length},
    habs, cartes:[], chronique:[], gagne:0};
  log(`${d.prenom} ${d.famille}, déçu·e par Ormund, a murmuré ton nom pour la première fois. Tu existes.`);
  log(`Le village compte ${habs.length} âmes. Ormund et Sélune règnent depuis des générations.`);
  genererPrieres();
  save();
}

/* ---------- lectures ---------- */
const croyants = () => S.habs.filter(h=>h.dieu==='joueur');
const ferveur = () => { const c=croyants(); return c.length? Math.round(c.reduce((a,h)=>a+h.foi,0)/c.length) : 0 };
const renommee = () => Math.round(100*S.habs.filter(h=>h.connait.joueur).length/S.habs.length);
const prod = () => S.habs.filter(h=>['fermier','pêcheur','boulanger'].includes(h.metier) && h.besoin!=='malade').length*2.5;
const jauges = () => {
  const v=S.village, n=S.habs.length;
  return {
    nourriture: clamp(Math.round(100*(v.stock/n)/6),0,100),   // 6 jours de réserve = 100%
    securite: Math.round(100*S.habs.filter(h=>h.besoin!=='menace').length/n),
    sante: Math.round(100*S.habs.filter(h=>h.besoin!=='malade').length/n),
    richesse: clamp(Math.round(v.richesse),0,100)
  };
};
const nomDieu = id => id==='joueur'? S.dieu.nom : DIEUX_PNJ.find(d=>d.id===id).nom;
const attr = (k,v) => S.dieu[k]===v;

/* ---------- coûts (colorés par les attributs) ---------- */
function coutAction(a){
  let c = {presage:2, pluie:8, guerison:10, abondance:20, bete:12, autel:15, temple:60, prophete:40}[a];
  if(a==='pluie'&&attr('element','eau')) c-=3;
  if(a==='bete'&&attr('element','feu')) c-=4;
  if(a==='abondance'&&attr('element','terre')) c-=5;
  if(a==='presage'&&attr('element','vent')) c-=1;
  return Math.max(1,c);
}
function coutCarte(c){
  let k = BESOINS[c.besoin].cout;
  if(c.conversion) k = attr('element','ombre')? k : k*2;
  if(c.conversion && attr('maniere','discret')) k-=1;
  return Math.max(1,k);
}

/* ---------- prières ---------- */
function genererPrieres(){
  S.habs.forEach(h=>{
    if(h.priePas>0) return;
    const douteur = h.foi<30;
    let besoin = h.besoin;
    if(!besoin && h.dieu==='joueur' && Math.random()<0.25) besoin='petite';
    if(!besoin && douteur && h.connait.joueur && Math.random()<0.2) besoin='petite';
    if(!besoin) return;
    if(h.dieu==='joueur' || (douteur && h.connait.joueur)){
      if(S.cartes.some(c=>c.hab===h.id)) return;
      S.cartes.push({id:Date.now()+rnd(9999), hab:h.id, besoin, conversion:h.dieu!=='joueur',
        txt:pick(BESOINS[besoin].txt), jour:S.jour});
      h.priePas=1;
    }
  });
}

function repondre(carte, exauce){
  const h = S.habs[carte.hab];
  S.cartes = S.cartes.filter(c=>c.id!==carte.id);
  if(exauce){
    const cout=coutCarte(carte);
    if(S.pouvoir<cout) return toast('Pas assez de pouvoir.');
    S.pouvoir-=cout;
    resoudre(h, carte.besoin);
    let gain = BESOINS[carte.besoin].foi; if(attr('maniere','brutal')) gain+=5;
    if(carte.conversion){
      const ancien=nomDieu(h.dieu);
      h.dieu='joueur'; h.foi=50;
      log(`${h.prenom} ${h.famille} a quitté ${ancien} pour te suivre. Ses proches ont entendu ton nom.`);
      S.habs.filter(x=>x.famille===h.famille).forEach(x=>{x.connait.joueur=true; if(x.dieu!=='joueur') x.foi-=5;});
      toast(`${h.prenom} te suit désormais !`);
    } else {
      h.foi=clamp(h.foi+gain,0,100);
      // les proches entendent parler du miracle
      if(Math.random()<0.5){ const p=pick(S.habs.filter(x=>x.famille===h.famille)); p.connait.joueur=true; }
    }
  } else {
    if(carte.conversion){ /* on laisse le douteur à son dieu */ }
    else { h.foi=clamp(h.foi-(attr('maniere','doux')?10:15),0,100);
      if(h.foi<30) log(`${h.prenom} ${h.famille} doute de toi.`); }
  }
  save(); render();
}

function resoudre(h, besoin){
  if(besoin==='affame'){ S.village.stock+=4; h.besoin=null; }
  if(besoin==='malade'){ h.besoin=null; }
  if(besoin==='menace'){ h.besoin=null; h.protege=2; }
  if(besoin==='pauvre'){ S.village.richesse+=3; h.besoin=null; }
  if(besoin==='petite'){ }
}

/* ---------- actions du catalogue ---------- */
const ACTIONS = [
  {id:'presage', type:'Signe', nom:'Présage', desc:'Un rêve visite toute une famille : elle te connaît et sa foi monte un peu.', cible:'famille'},
  {id:'pluie', type:'Miracle', nom:'Pluie bienfaisante', desc:'Les champs boivent : le grenier se remplit. Trop de pluie peut inonder une famille.', cible:'village'},
  {id:'guerison', type:'Miracle', nom:'Guérison', desc:'Tous les malades du village se relèvent. Ceux qui te connaissent voient le miracle.', cible:'village'},
  {id:'abondance', type:'Miracle', nom:'Abondance', desc:'Les échanges prospèrent : la richesse du village grimpe.', cible:'village'},
  {id:'bete', type:'Épreuve', nom:'Éveiller une bête', desc:'Une bête rôde : la peur multiplie les prières. Elle tue vraiment, et ton caractère s\'assombrit.', cible:'village'},
  {id:'autel', type:'Œuvre', nom:'Autel', desc:'Chaque jour, un habitant de plus apprend ton nom.', cible:'village', max:3},
  {id:'prophete', type:'Œuvre', nom:'Prophète', desc:'Il parle en ton nom : deux habitants par jour te découvrent, et les douteurs l\'écoutent.', cible:'village', max:1},
  {id:'temple', type:'Œuvre', nom:'Temple', desc:'Demande 10 croyants. Chaque jour : trois habitants te découvrent et la foi de tes fidèles monte.', cible:'village', max:1}
];

function faireAction(id, famille){
  const cout=coutAction(id);
  if(S.pouvoir<cout) return toast('Pas assez de pouvoir.');
  const a=ACTIONS.find(x=>x.id===id);
  if(a.max && S.oeuvres[id]>=a.max) return toast('Déjà construit.');
  if(id==='temple' && croyants().length<10) return toast('Il te faut 10 croyants.');
  S.pouvoir-=cout;
  const lum = attr('element','lumiere')?1.5:1;
  if(id==='presage'){
    const fam=S.habs.filter(h=>h.famille===famille);
    fam.forEach(h=>{h.connait.joueur=true; if(h.dieu==='joueur') h.foi=clamp(h.foi+5,0,100); else h.foi-=3;});
    log(`Un même rêve a visité les ${famille} cette nuit. Ton nom y était.`);
  }
  if(id==='pluie'){
    S.village.stock+=S.habs.length*2; log('Une pluie douce a gonflé les épis. Le grenier respire.');
    if(Math.random()<0.2){ const f=pick(FAMILLES); S.habs.filter(h=>h.famille===f&&!h.besoin).slice(0,2).forEach(h=>{h.besoin='pauvre';h.besoinDepuis=0;}); log(`Trop d'eau : la maison des ${f} a été inondée.`); }
    S.habs.filter(h=>Math.random()<0.3*lum).forEach(h=>h.connait.joueur=true);
  }
  if(id==='guerison'){
    const n=S.habs.filter(h=>h.besoin==='malade').length;
    S.habs.forEach(h=>{ if(h.besoin==='malade'){h.besoin=null; h.connait.joueur=true; if(h.dieu!=='joueur'&&h.foi<40) h.foi-=10;} });
    log(n? `${n} malade(s) se sont relevés d'un coup. Les gens se regardent, étonnés.` : 'Personne n\'était malade : le miracle est passé inaperçu.');
  }
  if(id==='abondance'){ S.village.richesse+=25; log('Les échoppes se remplissent, les bourses aussi.'); S.habs.filter(h=>Math.random()<0.25*lum).forEach(h=>h.connait.joueur=true); }
  if(id==='bete'){ S.village.bete=3+rnd(3); S.caractere-=2; log('Quelque chose a hurlé dans la forêt. Les volets se ferment tôt ce soir.'); }
  if(id==='autel'||id==='prophete'||id==='temple'){ S.oeuvres[id]++; log(`${a.nom} : ${id==='temple'?'les pierres s\'élèvent au centre du village.':id==='prophete'?'un homme s\'est mis à parler de toi sur la place.':'un petit autel de pierre se dresse à la lisière.'}`); }
  if(attr('maniere','visible')) S.habs.filter(h=>Math.random()<0.15).forEach(h=>h.connait.joueur=true);
  toast(a.nom+' !'); save(); render();
}

/* ---------- un jour qui passe ---------- */
function jourSuivant(){
  S.jour++;
  const v=S.village, n=S.habs.length;
  // 1. nourriture
  v.stock += prod() - n;
  if(v.stock<0){ v.stock=0; shuffle(S.habs.filter(h=>!h.besoin)).slice(0,4).forEach(h=>{h.besoin='affame';h.besoinDepuis=0;}); }
  // 2. richesse
  v.richesse += (prod()-n)/4 + S.habs.filter(h=>h.metier==='marchand'&&!h.besoin).length - 1;
  v.richesse = clamp(v.richesse,0,100);
  if(v.richesse<30 && Math.random()<0.5){ const h=pick(S.habs.filter(h=>!h.besoin)); if(h){h.besoin='pauvre';h.besoinDepuis=0;} }
  // 3. santé
  S.habs.forEach(h=>{ if(!h.besoin && Math.random()<(0.05+(v.stock<10?0.06:0))){h.besoin='malade';h.besoinDepuis=0;} });
  const soins=S.habs.filter(h=>h.metier==='soigneur'&&h.besoin!=='malade').length*2;
  S.habs.filter(h=>h.besoin==='malade'&&h.besoinDepuis>=2).slice(0,soins).forEach(h=>h.besoin=null);
  // 4. sécurité
  if(v.bete<=0 && Math.random()<0.1){ v.bete=2+rnd(3); log('Des traces inconnues près de la rivière. Une bête est arrivée.'); }
  if(v.bete>0){
    shuffle(S.habs.filter(h=>!h.besoin&&!h.protege)).slice(0,3).forEach(h=>{h.besoin='menace';h.besoinDepuis=0;});
    const soldats=S.habs.filter(h=>h.metier==='soldat'&&!h.besoin).length;
    v.bete -= 0.3+soldats*0.4;
    if(Math.random()<0.12){ const vict=pick(S.habs.filter(h=>h.besoin==='menace')); if(vict){ mort(vict, 'emporté·e par la bête'); } }
    if(v.bete<=0){ log('La bête a été chassée. Le village respire.'); S.habs.forEach(h=>{if(h.besoin==='menace')h.besoin=null;}); }
  }
  S.habs.forEach(h=>{ if(h.protege)h.protege--; });
  // 5. besoins qui durent
  S.habs.forEach(h=>{
    if(h.besoin){ h.besoinDepuis++; h.foi=clamp(h.foi-3,0,100);
      if(h.besoin==='affame'&&h.besoinDepuis>6&&Math.random()<0.2) mort(h,'mort·e de faim');
      if(h.besoin==='malade'&&h.besoinDepuis>5&&Math.random()<0.15) mort(h,'emporté·e par la fièvre');
    }
    h.priePas=Math.max(0,h.priePas-1);
  });
  // 6. les dieux PNJ répondent (les gros ignorent plus)
  DIEUX_PNJ.forEach(d=>{
    const fid=S.habs.filter(h=>h.dieu===d.id);
    const p=clamp(0.7 - fid.length/25, 0.15, 0.7);
    fid.forEach(h=>{
      const prie = h.besoin ? (h.besoinDepuis>=1 ? h.besoin : null) : (Math.random()<0.25 ? 'petite' : null);
      if(!prie) return;
      if(Math.random()<p){ resoudre(h,prie); h.foi=clamp(h.foi+12,0,100); }
      else h.foi=clamp(h.foi-(prie==='petite'?4:6),0,100);
    });
    // ils reconquièrent tes douteurs
    croyants().filter(h=>h.foi<30).forEach(h=>{ if(Math.random()<0.15){ h.dieu=d.id; h.foi=45; log(`${h.prenom} ${h.famille} est retourné·e vers ${d.nom}.`); } });
  });
  // 7. douteurs PNJ qui changent entre dieux PNJ (concurrence naturelle)
  S.habs.filter(h=>h.dieu!=='joueur'&&h.foi<25&&Math.random()<0.1).forEach(h=>{ const autre=DIEUX_PNJ.find(d=>d.id!==h.dieu); h.dieu=autre.id; h.foi=45; });
  // 8. œuvres
  for(let i=0;i<S.oeuvres.autel;i++){ const h=pick(S.habs.filter(h=>!h.connait.joueur)); if(h)h.connait.joueur=true; }
  for(let i=0;i<S.oeuvres.prophete*2;i++){ const h=pick(S.habs.filter(h=>!h.connait.joueur)); if(h)h.connait.joueur=true; }
  if(S.oeuvres.prophete){ S.habs.filter(h=>h.dieu!=='joueur'&&h.foi<30&&h.connait.joueur).forEach(h=>{ if(Math.random()<0.1){h.dieu='joueur';h.foi=45;log(`Le prophète a convaincu ${h.prenom} ${h.famille}.`);} }); }
  if(S.oeuvres.temple){ for(let i=0;i<3;i++){ const h=pick(S.habs.filter(h=>!h.connait.joueur)); if(h)h.connait.joueur=true; } croyants().forEach(h=>h.foi=clamp(h.foi+2,0,100)); }
  // 9. caractère revient doucement vers le centre
  if(S.caractere<0) S.caractere+=0.2;
  // 10. pouvoir du jour
  const c=croyants().length, f=ferveur();
  const gain = Math.ceil(c*f/100*1.5) + S.oeuvres.temple*2 + S.oeuvres.autel;
  S.pouvoir += gain;
  // 11. cartes trop vieilles = ignorées
  S.cartes.filter(k=>S.jour-k.jour>=2).forEach(k=>{ const h=S.habs[k.hab]; if(h.dieu==='joueur'){h.foi=clamp(h.foi-10,0,100);} });
  S.cartes=S.cartes.filter(k=>S.jour-k.jour<2);
  // 12. extinction / renaissance
  if(c===0){ const d=pick(S.habs.filter(h=>h.foi<30&&h.connait.joueur)); if(d&&Math.random()<0.4){d.dieu='joueur';d.foi=50;log(`${d.prenom} ${d.famille}, déçu·e, s'est souvenu·e de toi.`);} else if(!S.habs.some(h=>h.connait.joueur)){ pick(S.habs).connait.joueur=true; } }
  log(`Jour ${S.jour} — ${gain} de pouvoir reçu (${c} croyant·s, ferveur ${f}).`);
  genererPrieres();
}
function mort(h, cause){
  log(`${h.prenom} ${h.famille} est ${cause}.`);
  const i=S.habs.indexOf(h); S.habs.splice(i,1); S.habs.forEach((x,k)=>x.id=k);
  S.cartes=S.cartes.filter(c=>c.hab!==i).map(c=>({...c, hab:c.hab>i?c.hab-1:c.hab}));
  // une naissance remplace un mort (population stable)
  const fam=pick(FAMILLES); const dieu=pick(['ormund','selune']);
  S.habs.push({id:S.habs.length, prenom:pick(PRENOMS), famille:fam, metier:pick(METIERS), dieu, foi:50, besoin:null, besoinDepuis:0, connait:{}, priePas:0});
}
function rattraper(){
  let jours=Math.floor((Date.now()-S.derniereMaj)/DAY_MS);
  if(jours<=0) return;
  const n=Math.min(jours,30);
  for(let i=0;i<n;i++) jourSuivant();
  S.derniereMaj += jours*DAY_MS;
  if(n>0) toast(`${n} jour(s) ont passé pendant ton absence.`);
  save();
}

/* ---------- rendu ---------- */
const app=document.getElementById('app');
function render(){
  if(!S) return renderSetup();
  const j=jauges(), c=croyants().length;
  const nbConv=S.cartes.filter(k=>k.conversion).length;
  app.innerHTML=`
  <header>
    <h1><span>${S.dieu.nom}</span><small>jour ${S.jour} · v${VERSION}</small></h1>
    <div class="stats">
      <div class="stat gold"><b>${S.pouvoir}</b>pouvoir</div>
      <div class="stat"><b>${c}</b>croyants</div>
      <div class="stat"><b>${ferveur()}</b>ferveur</div>
      <div class="stat"><b>${renommee()}%</b>renommée</div>
    </div>
  </header>
  <main>
    <div class="tab ${tab==='prieres'?'on':''}" id="t-prieres">${renderPrieres()}</div>
    <div class="tab ${tab==='peuple'?'on':''}">${renderPeuple(j)}</div>
    <div class="tab ${tab==='actions'?'on':''}">${renderActions()}</div>
    <div class="tab ${tab==='chronique'?'on':''}">${renderChronique()}</div>
  </main>
  <nav>
    <button class="${tab==='prieres'?'on':''}" onclick="go('prieres')"><span>🙏</span>Prières${S.cartes.length?`<i>${S.cartes.length}</i>`:''}</button>
    <button class="${tab==='peuple'?'on':''}" onclick="go('peuple')"><span>🏘️</span>Peuple</button>
    <button class="${tab==='actions'?'on':''}" onclick="go('actions')"><span>✨</span>Actions</button>
    <button class="${tab==='chronique'?'on':''}" onclick="go('chronique')"><span>📜</span>Chronique</button>
  </nav>`;
}
function go(t){tab=t;render()}

function renderPrieres(){
  if(!S.cartes.length) return `<div class="empty">Aucune prière pour l'instant.<br>Le monde continue de tourner : reviens plus tard, ou avance d'un jour dans les outils de test (onglet Chronique).</div>`;
  const k=S.cartes[0], h=S.habs[k.hab], cout=coutCarte(k);
  return `<div class="card" id="carte" ontouchstart="ts(event)" ontouchend="te(event,${k.id})">
    <div class="who"><div class="face">${EMOJI[h.metier]}</div><div><b>${h.prenom} ${h.famille}<span class="tagc ${k.conversion?'conv':''}">${k.conversion?'suit '+nomDieu(h.dieu)+' · doute':'te suit · foi '+h.foi}</span></b><small>${h.metier}</small></div></div>
    <div class="prayer">« ${k.txt} »</div>
    <div class="btns"><button class="no" onclick="rep(${k.id},false)">Ignorer</button><button class="yes" ${S.pouvoir<cout?'disabled':''} onclick="rep(${k.id},true)">Exaucer · ${cout}</button></div>
    <div class="cost">${k.conversion?'Exaucer un douteur d\'un autre dieu coûte plus cher, mais il te suivra.':'Ignorer fait baisser sa foi. Sous 30, il doute et les autres dieux l\'entendent.'}</div>
  </div>
  <div class="cost">${S.cartes.length} prière(s) en attente · elles expirent après 2 jours</div>`;
}
let tx0=0;
function ts(e){tx0=e.touches[0].clientX}
function te(e,id){const dx=e.changedTouches[0].clientX-tx0; if(Math.abs(dx)>70) rep(id, dx>0);}
function rep(id,oui){
  const k=S.cartes.find(c=>c.id===id); if(!k)return;
  if(oui && S.pouvoir<coutCarte(k)) return toast('Pas assez de pouvoir.');
  const el=document.getElementById('carte'); el.classList.add(oui?'out-r':'out-l');
  setTimeout(()=>repondre(k,oui),220);
}

function barre(nom,val,aide){const cls=val<30?'bad':val<60?'warn':'';return `<div class="gauge"><div class="lbl"><span>${nom}</span><span>${val}%</span></div><div class="bar"><i class="${cls}" style="width:${val}%"></i></div><small style="color:var(--quiet);font-size:12px">${aide}</small></div>`}
function renderPeuple(j){
  const v=S.village;
  let s=`<h2>Le village</h2>
  ${barre('Nourriture',j.nourriture,`${Math.round(v.stock)} vivres en réserve · production ${prod()} / jour, consommation ${S.habs.length}`)}
  ${barre('Sécurité',j.securite,v.bete>0?'Une bête rôde autour du village.':'Rien ne menace le village.')}
  ${barre('Santé',j.sante,`${S.habs.filter(h=>h.besoin==='malade').length} malade(s)`)}
  ${barre('Richesse',j.richesse,'Ce que le village produit en plus de ses besoins.')}
  <h2>Les dieux</h2>`;
  ['joueur',...DIEUX_PNJ.map(d=>d.id)].forEach(id=>{const n=S.habs.filter(h=>h.dieu===id).length; s+=`<div class="row"><span>${nomDieu(id)}${id==='joueur'?' (toi)':''}<small>${id==='joueur'?[ELEMENTS[S.dieu.element],VALEURS[S.dieu.valeur],MANIERES[S.dieu.maniere]].join(' · ')+' · '+(S.caractere<-1?'sombre':'lumineux'):DIEUX_PNJ.find(d=>d.id===id).titre}</small></span><b>${n}</b></div>`});
  s+=`<p style="font-size:13px;color:var(--quiet)">Ton commandement : <i>${COMMANDEMENTS[S.dieu.valeur]}</i></p><h2>Les habitants</h2>`;
  [...S.habs].sort((a,b)=>(b.dieu==='joueur')-(a.dieu==='joueur')||a.famille.localeCompare(b.famille)).forEach(h=>{
    const et={affame:'a faim',malade:'malade',menace:'menacé·e',pauvre:'ruiné·e'}[h.besoin]||'';
    s+=`<div class="row"><span>${EMOJI[h.metier]} ${h.prenom} ${h.famille}<small>${h.metier}${et?' · '+et:''}${h.connait.joueur?'':' · ne te connaît pas'}</small></span><span class="foi ${h.dieu==='joueur'?'me':h.foi<30?'doubt':''}">${nomDieu(h.dieu)} ${h.foi}</span></div>`});
  return s;
}
function renderActions(){
  let s=`<p style="font-size:13px;color:var(--quiet);margin:0 0 10px">Ton pouvoir vaut à peu près croyants × ferveur. Dépense-le bien : il ne revient qu'une fois par jour.</p>`;
  ['Signe','Miracle','Épreuve','Œuvre'].forEach(type=>{
    s+=`<h2>${type}s</h2>`;
    ACTIONS.filter(a=>a.type===type).forEach(a=>{
      const cout=coutAction(a.id), fait=a.max&&S.oeuvres[a.id]>=a.max;
      let ctrl='';
      if(a.cible==='famille') ctrl=`<select class="sel" id="fam-${a.id}">${FAMILLES.map(f=>`<option>${f}</option>`).join('')}</select>`;
      s+=`<div class="act"><div><b>${a.nom}${fait?' ✓':''}</b><small>${a.desc}</small>${ctrl}</div><button ${S.pouvoir<cout||fait?'disabled':''} onclick="act('${a.id}')">${fait?'Fait':cout}</button></div>`;
    });
  });
  return s;
}
function act(id){const sel=document.getElementById('fam-'+id); faireAction(id, sel?sel.value:null)}
function renderChronique(){
  let s='<h2>Chronique</h2>'+S.chronique.map(l=>`<div class="log"><small>J${l.j}</small>${l.t}</div>`).join('');
  s+=`<div class="test">Outils de test — un jour de jeu = une heure réelle.<br>
  <button onclick="testJour()">+1 jour</button><button onclick="testJour(7)">+7 jours</button><button onclick="if(confirm('Tout effacer et recommencer ?')){localStorage.removeItem(SAVE_KEY);S=null;render()}">Recommencer</button></div>`;
  return s;
}
function testJour(n=1){for(let i=0;i<n;i++)jourSuivant(); save(); render();}

function renderSetup(){
  const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  app.innerHTML=`<div class="setup">
    <h1 style="margin:0 0 4px">Le jeu du dieu</h1>
    <p style="color:var(--quiet);font-size:14px">Quelque part, un habitant déçu par son dieu vient de murmurer un nom qui n'existait pas encore. Le tien.</p>
    <label>Ton nom</label><input id="nom" placeholder="Ilyra, Vorn, Aëlis…" maxlength="18">
    <label>Ton élément — sur quoi tu agis</label><select id="element">${opts(ELEMENTS)}</select>
    <label>Ta valeur — ce que tu récompenses</label><select id="valeur">${opts(VALEURS)}</select>
    <label>Ta manière — comment tu agis</label><select id="maniere">${opts(MANIERES)}</select>
    <button class="go" onclick="demarrer()">Naître</button>
    <p style="color:var(--quiet);font-size:12px;margin-top:20px">Prototype v${VERSION}. Tout se passe sur ce téléphone, un jour de jeu dure une heure réelle, et le village vit même quand tu n'es pas là.</p>
  </div>`;
}
function demarrer(){
  const nom=document.getElementById('nom').value.trim()||'Sans-Nom';
  nouveauMonde({nom, element:element.value, valeur:valeur.value, maniere:maniere.value});
  tab='prieres'; render();
}

/* ---------- démarrage ---------- */
(function(){
  try{ const s=localStorage.getItem(SAVE_KEY); if(s){ S=JSON.parse(s); rattraper(); } }catch(e){ S=null; }
  render();
  setInterval(()=>{ if(S){ const avant=S.jour; rattraper(); if(S.jour!==avant) render(); } }, 60000);
})();
</script>
</body>
</html>

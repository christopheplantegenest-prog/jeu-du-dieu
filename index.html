<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le jeu du dieu</title>
<style>
:root{--bg:#14161c;--card:#1e2129;--line:#2d313c;--ink:#ecebe4;--quiet:#9a9c9a;--gold:#e0b45c;--good:#6fbf73;--bad:#d96b5c;--violet:#b48be0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:70px}
header{padding:10px 14px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
header h1 small{font-size:11px;color:var(--quiet);font-weight:400}
.stats{display:flex;gap:6px;margin-top:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;flex:1;text-align:center}
.stat b{display:block;font-size:17px}
.stat.gold b{color:var(--gold)}
.stat.pro{border-color:var(--gold)}
main{padding:14px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--quiet);padding:8px 2px 6px;font-size:12px;position:relative}
nav button.on{color:var(--gold)}
nav button span{display:block;font-size:20px}
/* dialogue */
.msg{margin-bottom:10px;max-width:94%}
.msg.p{margin-right:auto}
.msg.toi{margin-left:auto;text-align:right}
.msg .b{display:inline-block;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.msg.toi .b{background:#4a3d1a;border-color:#6b5726}
.msg.monde .b{background:transparent;border:0;color:var(--quiet);font-size:13px;padding:2px 0}
.msg.imp .b{border-color:var(--gold)}
.msg small.q{display:block;font-size:11px;color:var(--quiet);margin:0 0 3px 4px}
.choix{margin:14px 0 6px;display:flex;flex-direction:column;gap:7px}
.choix button{background:var(--card);border:1px solid var(--gold);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:15px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.choix button small{color:var(--quiet);font-size:12px;text-align:right}
.choix button.sec{border-color:var(--line);color:var(--quiet)}
.choix button:disabled{opacity:.45}
.choix button.lock{border-color:var(--line)}
/* ville */
h2{font-size:14px;color:var(--quiet);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
h2:first-child{margin-top:0}
.gauge{margin-bottom:8px}
.gauge div.lbl{display:flex;justify-content:space-between;font-size:13px}
.bar{height:7px;background:#2b3040;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.warn{background:var(--gold)}.bar i.bad{background:var(--bad)}
.carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.carte h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between}
.carte h3 small{color:var(--quiet);font-weight:400;font-size:12px}
.mini{display:flex;gap:4px;margin-top:6px}
.mini i{flex:1;height:5px;border-radius:3px;background:#2b3040;position:relative;overflow:hidden}
.mini i b{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.mini i b.warn{background:var(--gold)}.mini i b.bad{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.row small{color:var(--quiet);display:block;font-size:12px}
.foi{font-size:12px;padding:2px 7px;border-radius:9px;background:#2b3040;white-space:nowrap}
.foi.me{background:#4a3d1a;color:var(--gold)}
.foi.doubt{background:#4a2a2a;color:#f0a0a0}
.retour{background:none;border:1px solid var(--line);color:var(--quiet);border-radius:8px;padding:6px 12px;margin-bottom:12px}
.log{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.log small{color:var(--quiet);margin-right:6px;white-space:nowrap}
.log.imp{color:var(--gold)}
.setup{padding:20px 16px}
.setup label{display:block;margin:14px 0 6px;color:var(--quiet);font-size:13px}
.setup input,.setup select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.setup .go{margin-top:24px;width:100%;padding:14px;background:var(--gold);border:0;border-radius:10px;font-size:17px;font-weight:600}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#2b3040;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
.toast.on{opacity:1}
.test{margin-top:24px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--quiet)}
.test button{background:#33363f;color:var(--ink);border:0;border-radius:8px;padding:8px 12px;margin:4px 4px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   LE JEU DU DIEU — prototype v4
   Une ville en quartiers. Des jauges par famille.
   Tu ne vois le monde que par ton prophète, et tu ne joues
   qu'en lui parlant. Le temps appartient au monde.
   ============================================================ */
const VERSION = 4;
const TICK_MS = 10*60*1000;
const TICKS_PAR_JOUR = 6;
const SAVE_KEY = 'jeu-du-dieu-v4';

const ELEMENTS = {eau:'Eau', feu:'Feu', terre:'Terre', vent:'Vent', lumiere:'Lumière', ombre:'Ombre'};
const VALEURS  = {justice:'Justice', liberte:'Liberté', partage:'Partage', ambition:'Ambition', ordre:'Ordre', chaos:'Chaos'};
const MANIERES = {doux:'Doux', brutal:'Brutal', visible:'Visible', discret:'Discret'};
const SAISONS = [{n:'Printemps',k:1.1,e:'🌱'},{n:'Été',k:1.3,e:'☀️'},{n:'Automne',k:0.9,e:'🍂'},{n:'Hiver',k:0.45,e:'❄️'}];
const JOURS_PAR_SAISON = 8;

const PRENOMS = ['Marthe','Odile','Gaspard','Léon','Brune','Thibault','Aurèle','Mahaut','Colin','Sidonie','Baptiste','Rosalie','Anselme','Iris','Firmin','Jeanne','Ambroise','Lison','Barnabé','Hortense','Côme','Perrine','Eloi','Flavie','Armand','Blanche','Casimir','Delphine','Émile','Faustine','Gautier','Honorine','Isidore','Joséphine','Lazare','Marceline','Nestor','Ondine','Philibert','Quitterie','Rémi','Solange','Tancrède','Ursule','Victorin','Wilhelmine','Zéphyr','Agathe','Basile','Clotilde','Désiré','Eulalie','Fulbert','Garance','Hippolyte','Inès','Jules','Léonie','Marius','Noémie','Oscar','Prudence','Raoul','Sabine','Théodore','Valentine','Yvon','Zoé'];
const NOMS = ['Vauclair','Moreau','Dufresne','Lambert','Roussel','Garnier','Perrault','Lenoir','Bonnet','Chevalier','Dumont','Fabre','Girard','Hamel','Joubert','Leclerc','Marchand','Noël','Olivier','Picard','Renard','Sauvage','Tessier','Valette','Baudry','Carlier','Delorme','Estève','Fournier','Gaillard'];
const QUARTIERS = ['le Port','la Colline','les Halles','le Faubourg','les Jardins','la Forge'];
const METIERS  = ['fermier','pêcheur','boulanger','forgeron','soigneur','soldat','marchand','tisserand','bûcheron','berger'];
const EMOJI = {fermier:'🌾',pêcheur:'🎣',boulanger:'🍞',forgeron:'⚒️',soigneur:'🌿',soldat:'🛡️',marchand:'⚖️',tisserand:'🧵',bûcheron:'🪓',berger:'🐑'};
const PRODUCTEURS = ['fermier','pêcheur','boulanger','berger'];
const DIEUX_PNJ = [{id:'ormund', nom:'Ormund', titre:'le Vieux Dieu des Moissons'},{id:'selune', nom:'Sélune', titre:'la Dame des Eaux Calmes'}];
const BESOINS = {affame:'a faim', malade:'malade', blesse:'blessé·e', menace:'menacé·e', querelle:'en querelle', pauvre:'ruiné·e', deuil:'en deuil'};

/* ---------- catalogue ---------- */
const SACRIFICES = [
  {id:'priere', nom:'Prier à genoux sur la place', poids:10, ferveur:2, desc:'devant tout le monde ; on peut se moquer'},
  {id:'jeune', nom:'Jeûner trois jours', poids:25, ferveur:5, desc:'il s\'affaiblit'},
  {id:'animal', nom:'Offrir un animal', poids:30, ferveur:8, desc:'six vivres de moins pour sa famille'},
  {id:'marche', nom:'Marcher jusqu\'au hameau voisin', poids:40, ferveur:6, desc:'il parle de toi à des inconnus ; peut se blesser'},
  {id:'recolte', nom:'Offrir toute sa récolte', poids:50, ferveur:15, desc:'sa famille aura faim'},
  {id:'bete', nom:'Affronter la bête', poids:60, ferveur:25, desc:'seulement si une bête rôde ; il peut mourir'},
  {id:'enfant', nom:'Sacrifier son enfant', poids:90, ferveur:60, desc:'un des siens meurt ; tu t\'assombris'}
];
const DOGMES = [
  {id:'louange', nom:'Louange quotidienne', poids:15, periode:6, ferveur:1, desc:'1 ferveur par fidèle et par jour'},
  {id:'dime', nom:'Dîme hebdomadaire', poids:30, periode:42, ferveur:5, desc:'5 ferveur par fidèle ; leur argent baisse'},
  {id:'offrande', nom:'Offrande d\'un animal par semaine', poids:35, periode:42, ferveur:10, desc:'10 ferveur par fidèle ; trois vivres de moins chacun'},
  {id:'jeune', nom:'Jeûne hebdomadaire', poids:40, periode:42, ferveur:6, desc:'6 ferveur par fidèle ; leur santé baisse'}
];
const AIDES = [
  {id:'nourrir', nom:'Nourris-les', cout:4, besoin:'affame', desc:'cinq vivres par personne'},
  {id:'guerir', nom:'Guéris-les', cout:5, besoin:'malade', desc:'santé rendue, blessures refermées'},
  {id:'proteger', nom:'Protège-les', cout:5, besoin:'menace', desc:'ni bête ni querelle pendant deux jours'},
  {id:'enrichir', nom:'Enrichis-les', cout:4, besoin:'pauvre', desc:'trente pièces trouvées sous une pierre'},
  {id:'consoler', nom:'Console-les', cout:2, besoin:'deuil', desc:'le deuil s\'apaise'}
];
const MIRACLES = [
  {id:'pluie', nom:'Pluie bienfaisante', cout:{quartier:10, ville:28}, desc:'les greniers se remplissent'},
  {id:'guerison', nom:'Grande guérison', cout:{quartier:14, ville:36}, desc:'tous les malades se relèvent'},
  {id:'abondance', nom:'Abondance', cout:{quartier:12, ville:32}, desc:'les bourses se remplissent'},
  {id:'protection', nom:'Protection', cout:{quartier:10, ville:26}, desc:'ni bête ni querelle pendant deux jours'},
  {id:'fete', nom:'Fête en ton nom', cout:{ville:20}, desc:'tes fidèles festoient, les curieux viennent'}
];

let S=null, tab='prophete', vue={q:null,f:null};

/* ---------- utilitaires ---------- */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a.length ? a[rnd(a.length)] : null;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function save(){localStorage.setItem(SAVE_KEY, JSON.stringify(S))}
function heure(){return (S.tick%TICKS_PAR_JOUR)*4}
function quand(){return `J${S.jour} · ${String(heure()).padStart(2,'0')}h`}
function log(t,imp){S.chronique.unshift({q:quand(), t, imp:!!imp}); if(S.chronique.length>150) S.chronique.length=150}
const nomH = h => `${h.prenom} ${fam(h).nom}`;
const saison = () => SAISONS[Math.floor((S.jour-1)/JOURS_PAR_SAISON)%4];
const fam = h => S.familles[h.fam];
const membres = f => S.habs.filter(h=>h.fam===f.id);
const famsDu = q => S.familles.filter(f=>f.quartier===q);
const habsDu = q => S.habs.filter(h=>fam(h).quartier===q);
const nomQ = qi => QUARTIERS[qi];
const Maj = s => s.charAt(0).toUpperCase()+s.slice(1);
function deQ(qi){ const q=QUARTIERS[qi]; return q.startsWith('le ')?'du '+q.slice(3):q.startsWith('les ')?'des '+q.slice(4):'de '+q.slice(3); }
function dire(de,t,imp){ S.msgs.push({q:quand(),de,t,imp:!!imp}); if(S.msgs.length>60) S.msgs.splice(0,S.msgs.length-60); }

/* ---------- création du monde ---------- */
function nouvelHabitant(f, dieu, prenoms){
  return {id:0, prenom:(prenoms||shuffle([...PRENOMS])).pop(), fam:f.id, metier:pick(METIERS),
    dieu, foi:35+rnd(50), sante:100, besoin:null, besoinDepuis:0, blesse:0, deuil:0, connait:false, protege:0, prophete:false, disciple:false};
}
function nouveauMonde(dieu){
  const familles=[], habs=[]; const noms=shuffle([...NOMS]); let prenoms=[];
  S = {version:VERSION, jour:1, tick:0, derniereMaj:Date.now(), dieu, ferveur:3, caractere:0, dogmes:[], msgs:[], node:'racine', ctx:{},
    quartiers:QUARTIERS.map(()=>({bete:0, conflit:null, conflitJours:0})), familles, habs, chronique:[], morts:0, fatigue:0, sacJour:0, alertes:{}};
  QUARTIERS.forEach((q,qi)=>{
    const nf=4+rnd(2);
    for(let i=0;i<nf;i++){
      const f={id:familles.length, nom:noms.pop(), quartier:qi, vivres:0, argent:20+rnd(40), protege:0};
      familles.push(f);
      const n=6+rnd(4); const dieuF = qi<4 ? 'ormund' : 'selune';
      for(let k=0;k<n;k++){ if(!prenoms.length) prenoms=shuffle([...PRENOMS]); habs.push(nouvelHabitant(f, Math.random()<0.85?dieuF:(dieuF==='ormund'?'selune':'ormund'), prenoms)); }
      f.vivres = 12*n + rnd(20);
    }
  });
  habs.forEach((h,i)=>h.id=i);
  familles.forEach(f=>{ const m=membres(f); if(!m.some(h=>PRODUCTEURS.includes(h.metier))) pick(m).metier=pick(PRODUCTEURS); });
  const p = pick(habs.filter(h=>h.dieu==='ormund'));
  p.dieu='joueur'; p.foi=55; p.prophete=true; p.connait=true;
  log(`${nomH(p)}, déçu·e par Ormund, a murmuré ton nom pour la première fois.`, true);
  dire('monde', `Une ville de ${habs.length} âmes, ${familles.length} familles, ${QUARTIERS.length} quartiers. Dans le quartier ${deQ(fam(p).quartier)}, ${nomH(p)}, ${p.metier}, vient de murmurer ton nom. Personne d'autre ne te connaît.`);
  dire('p', `Es-tu vraiment là ? Ormund ne m'écoute plus. Si tu existes, dis-moi ce que tu veux de moi. Je ferai ce que je peux.`, true);
  save();
}

/* ---------- lectures ---------- */
const croyants = () => S.habs.filter(h=>h.dieu==='joueur');
const prophete = () => S.habs.find(h=>h.prophete);
const disciples = () => S.habs.filter(h=>h.disciple);
const nomDieu = id => id==='joueur'? S.dieu.nom : DIEUX_PNJ.find(d=>d.id===id).nom;
const attr = (k,v) => S.dieu[k]===v;
const maxDogmes = () => { const p=prophete(); if(!p) return 0; return (p.foi<40?1:p.foi<70?2:3) + disciples().length; };
const suitDogme = (h,d) => h.dieu==='joueur' && h.foi>=d.poids;
const prodF = f => membres(f).filter(h=>PRODUCTEURS.includes(h.metier)&&!h.besoin).length*3*saison().k;
function jaugesF(f){ const m=membres(f); const q=S.quartiers[f.quartier]; return {
  nourriture: clamp(Math.round(100*(f.vivres/Math.max(1,m.length))/6),0,100),
  securite: clamp(Math.round(100 - (q.bete>0&&f.protege<=0?50:0) - (q.conflit&&q.conflit.includes(f.id)&&f.protege<=0?40:0)),0,100),
  sante: Math.round(m.reduce((a,h)=>a+h.sante,0)/Math.max(1,m.length)),
  richesse: clamp(Math.round(f.argent*1.5),0,100) }; }
function jaugesQ(qi){ const js=famsDu(qi).map(jaugesF); const moy=k=>Math.round(js.reduce((a,j)=>a+j[k],0)/Math.max(1,js.length)); return {nourriture:moy('nourriture'),securite:moy('securite'),sante:moy('sante'),richesse:moy('richesse')}; }
const besoinsDe = f => membres(f).filter(h=>h.besoin);

/* ---------- la simulation : une tranche ---------- */
function recalculerBesoins(){
  S.habs.forEach(h=>{
    const f=fam(h), q=S.quartiers[f.quartier];
    let b=null;
    if(h.blesse>0) b='blesse';
    else if(h.deuil>0) b='deuil';
    else if(f.vivres<=0) b='affame';
    else if(h.sante<40) b='malade';
    else if(q.bete>0 && f.protege<=0 && h.protege<=0) b='menace';
    else if(q.conflit && q.conflit.includes(f.id) && f.protege<=0) b='querelle';
    else if(f.argent<4) b='pauvre';
    if(b===h.besoin) h.besoinDepuis++; else { h.besoin=b; h.besoinDepuis=0; }
  });
}
function moment(){
  const evts=[];
  S.fatigue=Math.max(0,S.fatigue-2);
  S.familles.forEach(f=>{
    const m=membres(f); const soigneurs=m.filter(h=>h.metier==='soigneur'&&h.sante>60).length;
    const malades=m.filter(h=>h.sante<40).length;
    m.forEach(h=>{
      if(f.vivres<=0) h.sante-=2;
      if(h.sante>=40 && Math.random()<0.04*malades) h.sante-=15;
      const pMal=0.004+(saison().n==='Hiver'?0.004:0)+(f.vivres<=0?0.01:0);
      if(h.sante>=40 && Math.random()<pMal) h.sante-=35;
      if(['forgeron','bûcheron','fermier','soldat'].includes(h.metier)&&h.blesse<=0&&Math.random()<0.006){ h.blesse=8; h.sante-=15; }
      if(h.blesse>0) h.blesse--; if(h.deuil>0) h.deuil--;
      h.sante=clamp(h.sante+1+soigneurs*2,0,100);
      if(h.protege>0) h.protege--;
    });
    if(f.protege>0) f.protege--;
  });
  S.habs.filter(h=>h.sante<=0).forEach(h=>mort(h, fam(h).vivres<=0?'mort·e de faim':'emporté·e par la fièvre'));
  S.familles.forEach(f=>{ if(Math.random()<0.006){ f.argent=Math.max(0,f.argent-12); evts.push(`Des bandits ont dévalisé les ${f.nom}.`);} });
  S.quartiers.forEach((q,qi)=>{
    const fs=famsDu(qi), hs=habsDu(qi);
    if(q.bete<=0 && Math.random()<0.012){ q.bete=3+rnd(4); evts.push(`Une bête rôde dans le quartier ${deQ(qi)}.`); }
    if(q.bete>0){ const soldats=hs.filter(h=>h.metier==='soldat'&&!h.besoin).length; q.bete-=0.15+soldats*0.1; if(Math.random()<0.025){ const v=pick(hs.filter(h=>h.besoin==='menace')); if(v) mort(v,'emporté·e par la bête'); } if(q.bete<=0){ q.bete=0; evts.push(`La bête a été chassée ${deQ(qi)}.`);} }
    if(!q.conflit && fs.length>1 && Math.random()<0.015){ const a=pick(fs), b=pick(fs.filter(x=>x!==a)); q.conflit=[a.id,b.id]; q.conflitJours=2; evts.push(`Les ${a.nom} et les ${b.nom} se sont disputé un pré ${deQ(qi)}.`); }
    if(q.conflit && Math.random()<0.03){ const h=pick(hs.filter(x=>x.besoin==='querelle')); if(h){h.blesse=6;h.sante-=15; evts.push(`La querelle a tourné aux coups : ${nomH(h)} est blessé·e.`);} }
  });
  recalculerBesoins();
  S.habs.forEach(h=>{ if(h.besoin) h.foi=clamp(h.foi-1,0,100); });
  // dogmes
  S.dogmes.forEach(id=>{
    const d=DOGMES.find(x=>x.id===id); if(S.tick%d.periode!==0) return;
    const fid=croyants().filter(h=>suitDogme(h,d)), tri=croyants().filter(h=>!suitDogme(h,d));
    S.ferveur+=fid.length*d.ferveur;
    fid.forEach(h=>{ const f=fam(h); if(id==='dime') f.argent=Math.max(0,f.argent-3); if(id==='offrande') f.vivres-=3; if(id==='jeune') h.sante-=12; });
    tri.forEach(h=>h.foi=clamp(h.foi-2,0,100));
    if(fid.length) evts.push(`${d.nom} : ${fid.length} fidèles, +${fid.length*d.ferveur} ferveur${tri.length?` (${tri.length} ont fait semblant)`:''}.`);
  });
  if(S.tick%TICKS_PAR_JOUR===0) croyants().forEach(h=>{ const suit=S.dogmes.some(id=>suitDogme(h,DOGMES.find(x=>x.id===id))); h.foi=clamp(h.foi+(suit?1:-1),0,100); });
  // disciples et prophète dans leur quartier
  disciples().forEach(dp=>{ const qi=fam(dp).quartier; const hs=habsDu(qi); if(Math.random()<0.4){ const h=pick(hs.filter(x=>!x.connait)); if(h)h.connait=true; } const d=pick(hs.filter(h=>h.dieu!=='joueur'&&h.foi<30&&h.connait)); if(d&&Math.random()<0.04) convertir(d); });

function finDeJournee(){

}

/* ---------- actions (instantanées, par le prophète) ---------- */

    const nb=famsEnDiff.length;
    return {t: pick(['Que veux-tu de moi ?','Je t\'écoute.','Me voici. Parle.','Dis-moi où aller.']), c:[
      {l:'Il y a du nouveau ?', s:`${nb} famille${nb>1?'s':''} en difficulté`, go:'nouvelles'},
      {l:'Va quelque part.', s:'un quartier, une famille, une personne', go:'quartiers'},
      {l:'J\'ai une chose à te demander.', s:'un sacrifice, pour toi', go:'sacrifice', ctx:{qui:p.id}},
      {l:'Parlons de la religion.', s:`${S.dogmes.length}/${maxDogmes()} dogmes · ${disciples().length} disciple${disciples().length>1?'s':''}`, go:'religion'},
      {l:'Fais un miracle.', s:`${S.ferveur} ferveur`, go:'miracles', ctx:{q:undefined}},
      {l:'Parle-moi de toi.', s:`foi ${p.foi}${p.besoin?' · '+BESOINS[p.besoin]:''}${S.fatigue>8?' · épuisé':''}`, go:'toi'}
    ]};
  }

    const ch=[]; const qs=QUARTIERS.map((q,qi)=>({qi,n:famsDu(qi).reduce((a,f)=>a+besoinsDe(f).length,0)})).sort((a,b)=>b.n-a.n);
    let t='';
    const pire=qs[0]; if(pire.n) t+=`Le quartier ${deQ(pire.qi)} va le plus mal : ${pire.n} personnes souffrent. `;
    famsEnDiff.slice(0,4).forEach(f=>{ const b=besoinsDe(f); ch.push({l:`Les ${f.nom} (${nomQ(f.quartier)})`, s:b.slice(0,2).map(h=>BESOINS[h.besoin]).join(', ')+(b.length>2?'…':''), go:'famille', ctx:{f:f.id}}); });
    if(douteursConnus.length){ const d=pick(douteursConnus); t+=`${douteursConnus.length} personne${douteursConnus.length>1?'s':''} qui connaissent ton nom doutent de leur dieu. `; ch.push({l:`Va convaincre ${nomH(d)}`, s:`${nomQ(fam(d).quartier)} · ${nomDieu(d.dieu)} ${d.foi}`, do:()=>convaincre(d)}); }

    if(!t && !ch.length) t='Rien à signaler. Les gens vivent, et personne ne meurt. C\'est déjà beaucoup.';
    ch.push(retour());

  }
  if(n==='quartiers'){
    return {t:'Où dois-je aller ?', c:[...QUARTIERS.map((q,qi)=>{ const j=jaugesQ(qi), hs=habsDu(qi); const fid=hs.filter(h=>h.dieu==='joueur').length; const pire=Math.min(j.nourriture,j.sante,j.securite); return {l:Maj(q), s:`${famsDu(qi).length} familles · ${fid} fidèles${pire<40?' · en difficulté':''}${disciples().some(d=>fam(d).quartier===qi)?' · ✧':''}`, go:'quartier', ctx:{q:qi}}; }), retour()]};
  }
  if(n==='quartier'){
    const qi=c.q, fs=famsDu(qi), j=jaugesQ(qi), q=S.quartiers[qi];
    let t=`${Maj(nomQ(qi))}. ${j.nourriture<35?'On y a faim. ':''}${j.sante<50?'La fièvre y traîne. ':''}${q.bete>0?'Une bête rôde. ':''}${q.conflit?`Les ${S.familles[q.conflit[0]].nom} et les ${S.familles[q.conflit[1]].nom} se querellent. `:''}${habsDu(qi).filter(h=>h.dieu==='joueur').length} des leurs te suivent.`;
    const ch=fs.map(f=>{ const b=besoinsDe(f), m=membres(f); return {l:`Les ${f.nom}`, s:`${m.length} pers. · ${m.filter(h=>h.dieu==='joueur').length} fidèles${b.length?' · '+b.length+' en difficulté':''}`, go:'famille', ctx:{f:f.id}}; });
    ch.push({l:'Prêche sur la place.', s:'gratuit, selon ta foi', do:()=>precher(qi)});
    ch.push({l:'Un miracle sur le quartier.', s:'coûte de la ferveur', go:'miracles', ctx:{q:qi}});
    ch.push(retour('quartiers'));
    return {t, c:ch};
  }
  if(n==='famille'){
    const f=S.familles[c.f], m=membres(f), j=jaugesF(f), b=besoinsDe(f);
    const fid=m.filter(h=>h.dieu==='joueur'), dout=m.filter(h=>h.dieu!=='joueur'&&h.foi<30);
    let t=`Les ${f.nom}, ${nomQ(f.quartier)}. ${m.length} personnes, ${fid.length} te suivent${dout.length?`, ${dout.length} doutent de leur dieu`:''}. `;
    t+= j.nourriture<35?'Leur grenier est vide. ':j.nourriture>80?'Ils mangent à leur faim. ':''; t+= j.sante<50?'La maladie est dans la maison. ':''; t+= j.richesse<20?'Ils n\'ont plus un sou. ':''; t+= j.securite<60?'Ils ont peur. ':'';
    if(b.length) t+=`En ce moment : ${b.slice(0,4).map(h=>`${h.prenom} ${BESOINS[h.besoin]}`).join(', ')}${b.length>4?'…':''}.`;
    const ch=[{l:'Va les voir.', s:'gratuit · ils te découvrent, les douteurs t\'écoutent', do:()=>visiterFamille(f)}];
    const besoinsIds=[...new Set(b.map(h=>h.besoin))];
    AIDES.filter(a=>besoinsIds.includes(a.besoin)||(a.besoin==='malade'&&besoinsIds.includes('blesse'))).forEach(a=>ch.push({l:a.nom, s:`${a.cout} ferveur · ${a.desc}`, lock:S.ferveur<a.cout, do:()=>aiderFamille(f,a)}));
    if(b.length) ch.push({l:'Console quelqu\'un.', s:'gratuit, un geste humain', go:'personnes', ctx:{f:f.id, mode:'consoler'}});
    if(dout.length) ch.push({l:'Convaincs un douteur.', s:'gratuit, selon ta foi', go:'personnes', ctx:{f:f.id, mode:'convaincre'}});
    if(fid.length) ch.push({l:'Demande un sacrifice à un fidèle.', s:'rapporte de la ferveur', go:'personnes', ctx:{f:f.id, mode:'sacrifier'}});
    ch.push({l:'Parle-moi d\'eux.', s:'leurs jauges', go:'personnes', ctx:{f:f.id, mode:'voir'}});
    ch.push(retour('quartier', '← Le quartier'));
    S.ctx.q=f.quartier;
    return {t, c:ch};
  }
  if(n==='personnes'){
    const f=S.familles[c.f], m=membres(f), mode=c.mode;
    let liste=m; if(mode==='consoler') liste=m.filter(h=>h.besoin); if(mode==='convaincre') liste=m.filter(h=>h.dieu!=='joueur'&&h.foi<30); if(mode==='sacrifier') liste=m.filter(h=>h.dieu==='joueur');
    const t = mode==='voir' ? `Les ${f.nom} : ${Math.round(f.vivres)} vivres, ${Math.round(f.argent)} pièces, ${m.filter(h=>PRODUCTEURS.includes(h.metier)).length} qui nourrissent la maison.` : mode==='consoler'?'Qui ?':mode==='convaincre'?'Lequel ?':'À qui ?';
    const ch=liste.map(h=>({l:`${EMOJI[h.metier]} ${h.prenom}${h.prophete?' ✦':h.disciple?' ✧':''}`, s:`${h.metier} · ${nomDieu(h.dieu)} ${h.foi} · santé ${h.sante}${h.besoin?' · '+BESOINS[h.besoin]:''}`,
      do: mode==='consoler'?()=>consoler(h): mode==='convaincre'?()=>convaincre(h): null, go: mode==='sacrifier'?'sacrifice':(mode==='voir'?'personnes':null), ctx:{qui:h.id, f:f.id, mode}, sec: mode==='voir', lock: mode==='voir'}));
    ch.push(retour('famille','← La famille'));
    return {t, c:ch};
  }
  if(n==='sacrifice'){
    const h=S.habs.find(x=>x.id===c.qui)||p; const estP=h.prophete;
    const t= estP ? (p.foi<30?'Je t\'écoute. Mais ne me demande pas l\'impossible.':p.foi<60?'Dis-moi. Je ferai ce que je peux.':'Tout ce que tu voudras.') : `Que doit faire ${h.prenom} ?`;
    const ch=SACRIFICES.map(sa=>({l:sa.nom, s:`foi ${sa.poids} · +${sa.ferveur} ferveur · ${sa.desc}`, lock:h.foi+10<sa.poids || (sa.id==='bete'&&S.quartiers[fam(h).quartier].bete<=0), do:()=>demanderSacrifice(h,sa)}));
    ch.push(retour(estP?'racine':'famille'));
    return {t, c:ch};
  }
  if(n==='religion'){
    const ch=[{l:'Les dogmes.', s:`${S.dogmes.length}/${maxDogmes()} que tu peux faire respecter`, go:'dogmes'}];
    if(croyants().length>=8 && p.foi>=70 && disciples().length<QUARTIERS.length) ch.push({l:'Nomme un disciple.', s:'un fidèle qui tiendra un quartier', go:'disciple'});
    else ch.push({l:'Un disciple ?', s: croyants().length<8?'il faut 8 croyants':p.foi<70?'il faut que ta foi atteigne 70':'un par quartier, c\'est fait', lock:true});
    ch.push({l:'Prêche sur ta place.', s:'gratuit, selon ta foi', do:()=>precher(fam(p).quartier)});
    ch.push(retour());
    const d=disciples();
    return {t:`${croyants().length} te suivent. ${S.dogmes.length?'Dogmes : '+S.dogmes.map(id=>DOGMES.find(x=>x.id===id).nom.toLowerCase()).join(', ')+'. ':'Aucun dogme encore. '}${d.length?'Disciples : '+d.map(x=>`${x.prenom} (${nomQ(fam(x).quartier)})`).join(', ')+'.':''}`, c:ch};
  }
  if(n==='dogmes'){
    return {t:'Lesquels ?', c:[...DOGMES.map(d=>{ const on=S.dogmes.includes(d.id); const nb=croyants().filter(h=>suitDogme(h,d)).length; return {l:`${on?'✓ ':''}${d.nom}`, s:`${d.desc} · foi ${d.poids} · ${nb}/${croyants().length}`, do:()=>toggleDogme(d)}; }), retour('religion')]};
  }
  if(n==='disciple'){
    const cands=croyants().filter(h=>!h.prophete&&!h.disciple&&h.foi>=60).sort((a,b)=>b.foi-a.foi).slice(0,6);
    const pris=disciples().map(d=>fam(d).quartier);
    return {t:'Qui ? Il parlera en mon nom dans son quartier.', c:[...cands.map(h=>({l:`${nomH(h)}`, s:`${nomQ(fam(h).quartier)} · foi ${h.foi}${pris.includes(fam(h).quartier)?' · ce quartier a déjà un disciple':''}`, lock:pris.includes(fam(h).quartier), go:'religion', do:()=>{ h.disciple=true; log(`${nomH(h)} devient disciple.`, true); return `${h.prenom} a reçu ma parole, et tiendra ${nomQ(fam(h).quartier)} pour toi.`; }})), retour('religion')]};
  }
  if(n==='miracles'){
    const qi=c.q;
    const ch=[];
    if(qi===undefined) QUARTIERS.forEach((q,i)=>ch.push({l:Maj(q), s:'un miracle sur ce quartier', go:'miracles', ctx:{q:i}}));
    else MIRACLES.filter(m=>m.cout.quartier).forEach(m=>ch.push({l:m.nom, s:`${m.cout.quartier} ferveur · ${m.desc}`, lock:S.ferveur<m.cout.quartier, do:()=>miracle(m,'quartier',qi)}));
    MIRACLES.forEach(m=>ch.push({l:`${m.nom} — toute la ville`, s:`${m.cout.ville} ferveur · ${m.desc}`, lock:S.ferveur<m.cout.ville, do:()=>miracle(m,'ville')}));
    ch.push(retour(qi!==undefined?'quartier':'racine'));
    return {t: qi!==undefined?`Un miracle ${deQ(qi)} ? Ou sur toute la ville ?`:'Sur quel quartier ? Ou sur toute la ville ?', c:ch};
  }
  if(n==='toi'){
    const f=fam(p), j=jaugesF(f);
    let t=`Je suis ${nomH(p)}, ${p.metier}, ${nomQ(f.quartier)}. Ma foi en toi : ${p.foi<30?'elle vacille':p.foi<60?'elle tient':p.foi<85?'elle est solide':'je mourrais pour toi'}. `;
    t+= p.besoin?`Je suis ${BESOINS[p.besoin]}. `:''; t+= S.fatigue>8?'Je suis épuisé, laisse-moi souffler. ':''; t+= j.nourriture<35?'Ma famille a faim. ':''; t+= `Mes proches : ${membres(f).filter(h=>h.dieu==='joueur').length-1} sur ${membres(f).length-1} te suivent.`;
    const ch=[];
    if(p.besoin){ const a=AIDES.find(a=>a.besoin===p.besoin||(a.besoin==='malade'&&p.besoin==='blesse')); if(a) ch.push({l:'Aide-le.', s:`${a.cout} ferveur · ${a.desc}`, lock:S.ferveur<a.cout, do:()=>{ const r=aiderFamille(f,a); if(r.startsWith('Pas')) return r; p.foi=clamp(p.foi+10,0,100); return 'Merci. Je n\'oublierai pas.'; }}); ch.push({l:'Tiens bon.', s:'sa foi baisse', do:()=>{ p.foi=clamp(p.foi-6,0,100); return 'Je tiendrai. Je tiens toujours.'; }}); }
    ch.push({l:'Va voir ta famille.', s:'gratuit', do:()=>visiterFamille(f)});
    ch.push({l:'Que penses-tu de moi ?', s:'', do:()=> S.caractere<-1?'Tu es sombre, et j\'ai peur de toi. Mais la peur aussi fait prier.':croyants().length>20?'Tu es devenu un vrai dieu. Je ne suis plus seul à porter ton nom.':'Tu es nouveau. Les vieux dieux ont des temples, toi tu n\'as que moi. Ça me va.'});
    ch.push(retour());
    return {t, c:ch};
  }
  return {t:'…', c:[retour()]};
}
function choisir(i){
  const nd=noeud(); const ch=nd.c[i]; if(!ch||ch.lock) return;
  if(ch.sec && !ch.do && ch.go){ S.node=ch.go; S.ctx=Object.assign({},S.ctx,ch.ctx||{}); save(); render(); return; }
  dire('toi', ch.l);
  if(ch.ctx) S.ctx=Object.assign({},S.ctx,ch.ctx);
  if(ch.do){ const r=ch.do(); if(r) dire('p', r); }
  if(ch.go) S.node=ch.go;
  recalculerBesoins(); save(); render();
}

/* ---------- rendu ---------- */
const app=document.getElementById('app');
function render(){
  if(!S) return renderSetup();
  const p=prophete();
  app.innerHTML=`
  <header>
    <h1><span>${S.dieu.nom}</span><small>${quand()} · ${saison().e} · v${VERSION}</small></h1>
    <div class="stats">
      <div class="stat gold"><b>${S.ferveur}</b>ferveur</div>
      <div class="stat"><b>${croyants().length}</b>croyants</div>
      <div class="stat"><b>${S.habs.length}</b>habitants</div>
      <div class="stat pro"><b>${p?p.foi:'—'}</b>foi du prophète</div>
    </div>
  </header>
  <main>
    <div class="tab ${tab==='prophete'?'on':''}" id="conv">${renderConv()}</div>
    <div class="tab ${tab==='ville'?'on':''}">${renderVille()}</div>
    <div class="tab ${tab==='chronique'?'on':''}">${renderChronique()}</div>
  </main>
  <nav>
    <button class="${tab==='prophete'?'on':''}" onclick="go('prophete')"><span>✦</span>Prophète</button>
    <button class="${tab==='ville'?'on':''}" onclick="go('ville')"><span>🏘️</span>Ville</button>
    <button class="${tab==='chronique'?'on':''}" onclick="go('chronique')"><span>📖</span>Chronique</button>
  </nav>`;
  if(tab==='prophete') window.scrollTo(0, document.body.scrollHeight);
}
function go(t){tab=t;render();if(t!=='prophete')window.scrollTo(0,0)}
function renderConv(){
  const p=prophete(); const nd=noeud();
  let s=S.msgs.slice(-14).map(m=>`<div class="msg ${m.de} ${m.imp?'imp':''}">${m.de==='p'?`<small class="q">${p?p.prenom:'Le prophète'} · ${m.q}</small>`:''}<div class="b">${m.t}</div></div>`).join('');
  if(!p) return s+`<div class="msg monde"><div class="b">Tu n'as plus de prophète. Attends qu'un déçu se souvienne de toi.</div></div>`;
  s+=`<div class="msg p imp"><small class="q">${p.prenom} · ${quand()}</small><div class="b">${nd.t}</div></div>`;
  s+=`<div class="choix">${nd.c.map((c,i)=>`<button class="${c.sec?'sec':''} ${c.lock?'lock':''}" ${c.lock?'disabled':''} onclick="choisir(${i})"><span>${c.l}</span>${c.s?`<small>${c.s}</small>`:''}</button>`).join('')}</div>`;
  const prochain = 10 - Math.floor(((Date.now()-S.derniereMaj)%TICK_MS)/60000);
  s+=`<div class="msg monde"><div class="b">Le monde avance dans ${prochain} min.</div></div>`;
  return s;
}
function barre(nom,val,aide){const cls=val<30?'bad':val<60?'warn':'';return `<div class="gauge"><div class="lbl"><span>${nom}</span><span>${val}%</span></div><div class="bar"><i class="${cls}" style="width:${val}%"></i></div>${aide?`<small style="color:var(--quiet);font-size:12px">${aide}</small>`:''}</div>`}
function mini(j){ return `<div class="mini">${['nourriture','securite','sante','richesse'].map(k=>`<i><b class="${j[k]<30?'bad':j[k]<60?'warn':''}" style="width:${j[k]}%"></b></i>`).join('')}</div>`; }
function renderVille(){
  if(vue.f!==null){
    const f=S.familles[vue.f], j=jaugesF(f), m=membres(f);
    let s=`<button class="retour" onclick="vue.f=null;render()">← ${Maj(nomQ(f.quartier))}</button><h2>Les ${f.nom}</h2>
    ${barre('Nourriture',j.nourriture,`${Math.round(f.vivres)} vivres · ${Math.round(prodF(f))} récoltés par jour, ${m.length} mangent`)}${barre('Sécurité',j.securite)}${barre('Santé',j.sante)}${barre('Richesse',j.richesse,`${Math.round(f.argent)} pièces`)}<h2>Les membres</h2>`;
    m.sort((a,b)=>(b.dieu==='joueur')-(a.dieu==='joueur')).forEach(h=>{ s+=`<div class="row"><span>${EMOJI[h.metier]} ${h.prenom}${h.prophete?' ✦':h.disciple?' ✧':''}<small>${h.metier} · santé ${h.sante}${h.besoin?' · '+BESOINS[h.besoin]:''}${h.connait?'':' · ne te connaît pas'}</small></span><span class="foi ${h.dieu==='joueur'?'me':h.foi<30?'doubt':''}">${nomDieu(h.dieu)} ${h.foi}</span></div>`; });
    return s;
  }
  if(vue.q!==null){
    const qi=vue.q, q=S.quartiers[qi], j=jaugesQ(qi);
    let s=`<button class="retour" onclick="vue.q=null;render()">← La ville</button><h2>${nomQ(qi)}</h2>${barre('Nourriture',j.nourriture)}${barre('Sécurité',j.securite,q.bete>0?'Une bête rôde.':q.conflit?'Deux familles se querellent.':'')}${barre('Santé',j.sante)}${barre('Richesse',j.richesse)}<h2>Les familles</h2>`;
    famsDu(qi).forEach(f=>{ const m=membres(f), jf=jaugesF(f), b=besoinsDe(f); s+=`<div class="carte" onclick="vue.f=${f.id};render()"><h3>Les ${f.nom}<small>${m.filter(h=>h.dieu==='joueur').length}/${m.length} te suivent${b.length?' · '+b.length+' en difficulté':''}</small></h3>${mini(jf)}</div>`; });
    return s;
  }
  let s=`<h2>Les dieux</h2>`;
  ['joueur',...DIEUX_PNJ.map(d=>d.id)].forEach(id=>{const n=S.habs.filter(h=>h.dieu===id).length; s+=`<div class="row"><span>${nomDieu(id)}${id==='joueur'?' (toi)':''}<small>${id==='joueur'?[ELEMENTS[S.dieu.element],VALEURS[S.dieu.valeur],MANIERES[S.dieu.maniere]].join(' · ')+' · '+(S.caractere<-1?'sombre':'lumineux'):DIEUX_PNJ.find(d=>d.id===id).titre}</small></span><b>${n}</b></div>`});
  s+=`<h2>Les quartiers</h2>`;
  QUARTIERS.forEach((qn,qi)=>{ const j=jaugesQ(qi), hs=habsDu(qi); s+=`<div class="carte" onclick="vue.q=${qi};render()"><h3>${Maj(qn)}<small>${hs.filter(h=>h.dieu==='joueur').length}/${hs.length} te suivent${disciples().some(d=>fam(d).quartier===qi)?' · ✧':''}</small></h3>${mini(j)}</div>`; });
  s+=`<p style="font-size:12px;color:var(--quiet)">Barres : nourriture, sécurité, santé, richesse. Tu vois tout ; tu n'agis que par le prophète.</p>`;
  return s;
}
function renderChronique(){
  let s='<h2>Chronique</h2>'+S.chronique.map(l=>`<div class="log ${l.imp?'imp':''}"><small>${l.q}</small>${l.t}</div>`).join('');
  s+=`<div class="test">Outils de test — une tranche = 10 minutes réelles, 6 tranches = 1 jour.<br>
  <button onclick="testAv(1)">+1 tranche</button><button onclick="testAv(6)">+1 jour</button><button onclick="testAv(42)">+7 jours</button><button onclick="S.ferveur+=20;save();render()">+20 ferveur</button><button onclick="if(confirm('Tout effacer et recommencer ?')){localStorage.removeItem(SAVE_KEY);S=null;render()}">Recommencer</button></div>`;
  return s;
}
function testAv(n){for(let i=0;i<n;i++)avancer(); save(); render();}
function renderSetup(){
  const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  app.innerHTML=`<div class="setup">
    <h1 style="margin:0 0 4px">Le jeu du dieu</h1>
    <p style="color:var(--quiet);font-size:14px">Une ville de deux cents âmes. Tu ne la verras que par les yeux d'un seul homme, ton prophète, et tu n'agiras que par ses mains.</p>
    <label>Ton nom</label><input id="nom" placeholder="Ilyra, Vorn, Aëlis…" maxlength="18">
    <label>Ton élément</label><select id="element">${opts(ELEMENTS)}</select>
    <label>Ta valeur</label><select id="valeur">${opts(VALEURS)}</select>
    <label>Ta manière</label><select id="maniere">${opts(MANIERES)}</select>
    <button class="go" onclick="demarrer()">Naître</button>
    <p style="color:var(--quiet);font-size:12px;margin-top:20px">Prototype v${VERSION}. Le monde avance toutes les dix minutes, même quand tu n'es pas là.</p>
  </div>`;
}
function demarrer(){ const nom=document.getElementById('nom').value.trim()||'Sans-Nom'; nouveauMonde({nom, element:element.value, valeur:valeur.value, maniere:maniere.value}); tab='prophete'; render(); }

(function(){
  try{ const s=localStorage.getItem(SAVE_KEY); if(s){ S=JSON.parse(s); if(S.version!==VERSION) S=null; } }catch(e){ S=null; }
  if(S){ const n=rattraper(); if(n) setTimeout(()=>toast(`${n} tranche(s) ont passé pendant ton absence.`),300); }
  render();
  setInterval(()=>{ if(S && rattraper()) render(); }, 30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S && rattraper()) render(); });
})();
</script>
</body>
</html>
